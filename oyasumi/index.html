<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OYASUMI-6 おやすみ端末</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #05070f;
    color: #aab4cc;
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
    font-size: 17px;
    line-height: 1.7;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 14px 60px; }
  .portal-link {
    display: inline-block;
    min-height: 48px;
    line-height: 48px;
    padding: 0 14px;
    color: #8fa3cc;
    text-decoration: none;
    border: 1px solid #26304a;
    border-radius: 10px;
    background: #0a0e1c;
    font-size: 15px;
  }
  h1 {
    font-size: 24px;
    margin: 18px 0 2px;
    color: #cfd8ee;
    font-weight: normal;
    letter-spacing: 2px;
  }
  .subtitle { color: #66738f; font-size: 14px; margin: 0 0 14px; }
  .greeting {
    background: #0a0e1c;
    border: 1px solid #1d2742;
    border-radius: 12px;
    padding: 14px 16px;
    color: #bfc9e2;
    font-size: 18px;
    margin-bottom: 22px;
  }
  h2 { font-size: 18px; color: #bfc9e2; font-weight: normal; margin: 26px 0 10px; letter-spacing: 1px; }
  .chips { margin-bottom: 14px; }
  .chip {
    display: inline-block;
    min-height: 48px;
    line-height: 48px;
    padding: 0 18px;
    margin: 0 8px 10px 0;
    border-radius: 24px;
    border: 1px solid #2a3554;
    background: #0a0e1c;
    color: #9fb0d4;
    font-size: 16px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .chip.sel {
    background: #1b2748;
    border-color: #5a6f9e;
    color: #e6ecfa;
  }
  .bigbtn {
    display: block;
    width: 100%;
    min-height: 56px;
    border-radius: 12px;
    border: 1px solid #3a4a75;
    background: #16223f;
    color: #e6ecfa;
    font-size: 19px;
    padding: 12px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .bigbtn:disabled { opacity: 0.5; }
  .togglebtn {
    display: block;
    width: 100%;
    min-height: 56px;
    border-radius: 12px;
    border: 1px solid #2a3554;
    background: #0a0e1c;
    color: #9fb0d4;
    font-size: 18px;
    padding: 12px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .togglebtn.on {
    background: #14263a;
    border-color: #3f6d8f;
    color: #cfe8f5;
  }
  .status { color: #66738f; font-size: 15px; min-height: 24px; margin: 10px 2px; }
  .status .detail { display: block; font-size: 12px; color: #4a5570; }
  .story {
    display: none;
    background: #080b16;
    border: 1px solid #1d2742;
    border-radius: 12px;
    padding: 20px 18px;
    margin-top: 14px;
    font-size: 22px;
    line-height: 2.0;
    color: #d5ddef;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .note { color: #4a5570; font-size: 13px; margin-top: 10px; }
  #dimmer {
    position: fixed;
    left: 0; top: 0; right: 0; bottom: 0;
    background: #000000;
    opacity: 0;
    pointer-events: none;
    z-index: 40;
  }
  #stopBtn {
    position: fixed;
    right: 14px;
    bottom: 16px;
    z-index: 50;
    display: none;
    min-width: 110px;
    min-height: 48px;
    border-radius: 24px;
    border: 1px solid #3a4a75;
    background: rgba(16, 24, 46, 0.92);
    color: #cfd8ee;
    font-size: 16px;
    padding: 10px 18px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="portal-link" href="../portal/">← 全サイト一覧へ</a>
  <h1>🌙 OYASUMI-6</h1>
  <p class="subtitle">おやすみ端末 ― 静かな夜のためのページです</p>

  <div class="greeting" id="greeting"></div>

  <h2>おやすみ物語</h2>
  <div class="chips" id="chips">
    <span class="chip sel" data-theme="ダックスの夢">🐶 ダックスの夢</span>
    <span class="chip" data-theme="星の旅">⭐ 星の旅</span>
    <span class="chip" data-theme="静かな海">🌊 静かな海</span>
    <span class="chip" data-theme="森の小屋">🌲 森の小屋</span>
  </div>
  <button class="bigbtn" id="storyBtn">物語をはじめる</button>
  <div class="status" id="storyStatus"></div>
  <div class="story" id="storyBox"></div>
  <p class="note">物語が始まると、画面は約60秒かけてゆっくり暗くなります。読み上げを止めたいときは、右下の「止める」ボタンを押してください。</p>

  <h2>雨音</h2>
  <button class="togglebtn" id="rainBtn">☔ 雨音をながす</button>
  <div class="status" id="rainStatus"></div>
  <p class="note">雨音はこの端末の中で作っている音です。音量は控えめにしてあります。</p>
</div>

<div id="dimmer"></div>
<button id="stopBtn">止める</button>

<script>
var theme = "ダックスの夢";
var waiting = false;
var waitSec = 0;
var waitTimer = null;
var waitRetry = false;
var dimTimer = null;
var dimLevel = 0;

function nightGreeting() {
  var h = new Date().getHours();
  if (h >= 23 || h < 1) { return "もう真夜中です。今日も一日おつかれさまでした。ゆっくり休んでくださいね。"; }
  if (h >= 1 && h < 4) { return "夜更けですね。静かな時間です。あたたかくして、おやすみなさい。"; }
  if (h >= 4 && h < 6) { return "もうすぐ夜明けです。少しでも眠れますように。"; }
  if (h >= 18 && h < 23) { return "こんばんは。今日も一日おつかれさまでした。おやすみの準備をしましょう。"; }
  return "おやすみの時間に、また来てくださいね。今はまだ明るい時間です。";
}
document.getElementById("greeting").innerHTML = nightGreeting();

var chipsBox = document.getElementById("chips");
chipsBox.onclick = function (e) {
  var t = e.target;
  if (!t || !t.getAttribute) { return; }
  var th = t.getAttribute("data-theme");
  if (!th) { return; }
  theme = th;
  var kids = chipsBox.children;
  for (var i = 0; i < kids.length; i++) {
    if (kids[i].getAttribute("data-theme") === th) {
      kids[i].className = "chip sel";
    } else {
      kids[i].className = "chip";
    }
  }
};

function setStatus(msg, detail) {
  var el = document.getElementById("storyStatus");
  var html = msg;
  if (detail) { html += '<span class="detail">' + detail + "</span>"; }
  el.innerHTML = html;
}

function startWait() {
  waiting = true;
  waitSec = 0;
  waitRetry = false;
  setStatus("物語を準備中… 0秒", "");
  waitTimer = setInterval(function () {
    waitSec++;
    setStatus("物語を準備中… " + waitSec + "秒" + (waitRetry ? "（再試行中）" : ""), "");
  }, 1000);
}

function stopWait() {
  waiting = false;
  if (waitTimer) { clearInterval(waitTimer); waitTimer = null; }
}

function startDim() {
  stopDim();
  dimLevel = 0;
  var dimmer = document.getElementById("dimmer");
  dimmer.style.opacity = "0";
  document.getElementById("stopBtn").style.display = "block";
  dimTimer = setInterval(function () {
    dimLevel += 0.92 / 120;
    if (dimLevel >= 0.92) {
      dimLevel = 0.92;
      clearInterval(dimTimer);
      dimTimer = null;
    }
    dimmer.style.opacity = String(dimLevel);
  }, 500);
}

function stopDim() {
  if (dimTimer) { clearInterval(dimTimer); dimTimer = null; }
  dimLevel = 0;
  document.getElementById("dimmer").style.opacity = "0";
  document.getElementById("stopBtn").style.display = "none";
}

function speakStory(text) {
  if (!("speechSynthesis" in window)) { return; }
  try {
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "ja-JP";
    u.pitch = 0.9;
    u.rate = 0.9;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

function stopAll() {
  if ("speechSynthesis" in window) {
    try { window.speechSynthesis.cancel(); } catch (e) {}
  }
  stopDim();
  setStatus("止めました。おやすみなさい。", "");
}

document.getElementById("stopBtn").onclick = function () { stopAll(); };

function extractText(res) {
  var text = "";
  try {
    if (res && res.choices && res.choices[0] && res.choices[0].message && res.choices[0].message.content) {
      text = res.choices[0].message.content;
    }
  } catch (e) {}
  return text;
}

function cleanReply(s) {
  if (!s) { return ""; }
  s = String(s);
  s = s.replace(/[#>*`_~\-]{1,}/g, "");
  s = s.replace(/\s+/g, " ");
  s = s.replace(/^\s+|\s+$/g, "");
  return s;
}

document.getElementById("storyBtn").onclick = function () {
  if (waiting) { return; }
  stopDim();
  if ("speechSynthesis" in window) {
    try { window.speechSynthesis.cancel(); } catch (e) {}
  }
  document.getElementById("storyBtn").disabled = true;
  startWait();
  var prompt = "あなたはおやすみ物語の語り手です。テーマ「" + theme + "」で、眠る前に聞く短くてやさしい物語を、静かで穏やかな口調で書いてください。条件：日本語の地の文のみ、350文字以内、マークダウン記号や箇条書きは使わない、最後は必ず「おやすみなさい。」で終える。";
  var payload = JSON.stringify({ messages: [{ role: "user", content: prompt }], model: "openai-fast" });
  var retried = false;
  var attempt = 0;
  function sendStory() {
    attempt++;
    var my = attempt;
    var xhr = new XMLHttpRequest();
    xhr.open("POST", "https://text.pollinations.ai/", true);
    xhr.setRequestHeader("Content-Type", "application/json");
    xhr.timeout = retried ? 45000 : 30000;
    xhr.onreadystatechange = function () {
      if (my !== attempt) { return; }
      if (xhr.readyState !== 4) { return; }
      var body = xhr.responseText || "";
      if (xhr.status === 402 || body.indexOf("Free limit") !== -1) {
        stopWait();
        document.getElementById("storyBtn").disabled = false;
        setStatus("本日の無料AI回線は上限に達しました。明日の朝9時に回復します", "");
        return;
      }
      if (xhr.status !== 200) {
        if (!retried && (xhr.status === 0 || xhr.status >= 500)) {
          retried = true;
          waitRetry = true;
          sendStory();
          return;
        }
        stopWait();
        document.getElementById("storyBtn").disabled = false;
        setStatus("AI回線が混み合っています", "詳細：HTTP " + xhr.status);
        return;
      }
      stopWait();
      document.getElementById("storyBtn").disabled = false;
      var res = null;
      try { res = JSON.parse(body); } catch (e) {}
      var story = cleanReply(extractText(res));
      if (!story) {
        setStatus("AI回線が混み合っています", "詳細：HTTP " + xhr.status);
        return;
      }
      if (story.length > 500) { story = story.substring(0, 500); }
      var box = document.getElementById("storyBox");
      box.style.display = "block";
      box.innerHTML = "";
      box.appendChild(document.createTextNode(story));
      setStatus("物語がはじまります。画面はゆっくり暗くなります。", "");
      speakStory(story);
      startDim();
    };
    xhr.ontimeout = function () {
      if (my !== attempt) { return; }
      if (!retried) {
        retried = true;
        waitRetry = true;
        sendStory();
        return;
      }
      stopWait();
      document.getElementById("storyBtn").disabled = false;
      setStatus("時間がかかりすぎたため、物語を用意できませんでした。少し待ってから、もう一度お試しください", "");
    };
    xhr.onerror = function () {
      if (my !== attempt) { return; }
      if (!retried) {
        retried = true;
        waitRetry = true;
        sendStory();
        return;
      }
      stopWait();
      document.getElementById("storyBtn").disabled = false;
      setStatus("AI回線が混み合っています", "詳細：HTTP 0");
    };
    xhr.send(payload);
  }
  sendStory();
};

/* ---- 雨音（WebAudioで生成） ---- */
var audioCtx = null;
var rainNodes = null;
var rainOn = false;

function buildRain() {
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) { return null; }
  var ctx = new AC();
  var len = 2 * ctx.sampleRate;
  var buffer = ctx.createBuffer(1, len, ctx.sampleRate);
  var data = buffer.getChannelData(0);
  var i;
  for (i = 0; i < len; i++) { data[i] = Math.random() * 2 - 1; }
  var src = ctx.createBufferSource();
  src.buffer = buffer;
  src.loop = true;
  var filter = ctx.createBiquadFilter();
  filter.type = "lowpass";
  filter.frequency.value = 420;
  filter.Q.value = 0.4;
  var gain = ctx.createGain();
  gain.gain.value = 0.12;
  var lfo = ctx.createOscillator();
  lfo.type = "sine";
  lfo.frequency.value = 0.13;
  var lfoGain = ctx.createGain();
  lfoGain.gain.value = 0.045;
  lfo.connect(lfoGain);
  lfoGain.connect(gain.gain);
  src.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);
  src.start();
  lfo.start();
  return { ctx: ctx, src: src, lfo: lfo, gain: gain };
}

document.getElementById("rainBtn").onclick = function () {
  var btn = document.getElementById("rainBtn");
  var st = document.getElementById("rainStatus");
  if (rainOn) {
    if (rainNodes) {
      try { rainNodes.src.stop(); } catch (e) {}
      try { rainNodes.lfo.stop(); } catch (e) {}
      try { rainNodes.ctx.close(); } catch (e) {}
      rainNodes = null;
    }
    rainOn = false;
    btn.className = "togglebtn";
    btn.innerHTML = "☔ 雨音をながす";
    st.innerHTML = "";
    return;
  }
  if (!audioCtx) {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) {
      st.innerHTML = "この端末では音を再生できませんでした。";
      return;
    }
  }
  rainNodes = buildRain();
  if (!rainNodes) {
    st.innerHTML = "この端末では音を再生できませんでした。";
    return;
  }
  rainOn = true;
  btn.className = "togglebtn on";
  btn.innerHTML = "☔ 雨音を止める";
  st.innerHTML = "雨音をながしています。";
};
</script>
</body>
</html>
