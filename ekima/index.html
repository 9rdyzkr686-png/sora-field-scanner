<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EKIMA-6 ダックス駅</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #050505;
    color: #ffb000;
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
    padding: 10px;
  }
  .station-sign {
    border: 3px solid #ffb000;
    border-radius: 10px;
    text-align: center;
    padding: 10px 6px 8px;
    margin-bottom: 10px;
    background: #0a0800;
  }
  .station-name {
    font-size: 34px;
    font-weight: bold;
    letter-spacing: 6px;
    color: #ffd34d;
    text-shadow: 0 0 8px rgba(255, 176, 0, 0.7);
  }
  .station-sub {
    font-size: 14px;
    letter-spacing: 3px;
    color: #cc8f00;
    margin-top: 2px;
  }
  .board {
    background: #000;
    border: 2px solid #4d3800;
    border-radius: 8px;
    padding: 8px 6px;
    font-family: "Courier New", monospace;
  }
  .board-head {
    display: table;
    width: 100%;
    font-size: 13px;
    color: #99700a;
    letter-spacing: 2px;
    border-bottom: 1px dashed #4d3800;
    padding-bottom: 4px;
    margin-bottom: 4px;
  }
  .board-head span, .row span { display: table-cell; }
  .c-time { width: 62px; }
  .c-type { width: 52px; }
  .c-dest { }
  .c-home { width: 58px; text-align: right; }
  .row {
    display: table;
    width: 100%;
    font-size: 21px;
    font-weight: bold;
    letter-spacing: 2px;
    color: #ffb000;
    text-shadow: 0 0 6px rgba(255, 176, 0, 0.55);
    padding: 7px 0;
    border-bottom: 1px solid #1c1400;
  }
  .row .c-type { font-size: 17px; }
  .row .c-home { font-size: 17px; color: #cc8f00; }
  .row.special {
    color: #4dd2ff;
    text-shadow: 0 0 8px rgba(77, 210, 255, 0.8);
  }
  .row.special .c-home { color: #2a9ec7; }
  .row.special .c-type { color: #4dd2ff; }
  .countdown-box {
    margin-top: 12px;
    background: #0a0800;
    border: 2px solid #4d3800;
    border-radius: 8px;
    text-align: center;
    padding: 10px 6px;
  }
  .countdown-label {
    font-size: 15px;
    letter-spacing: 2px;
    color: #cc8f00;
  }
  .countdown-next {
    font-size: 19px;
    font-weight: bold;
    color: #ffd34d;
    margin-top: 4px;
    letter-spacing: 1px;
  }
  .countdown-time {
    font-family: "Courier New", monospace;
    font-size: 40px;
    font-weight: bold;
    color: #ffb000;
    text-shadow: 0 0 10px rgba(255, 176, 0, 0.7);
    letter-spacing: 4px;
    margin-top: 2px;
  }
  .buttons { margin-top: 12px; }
  .btn {
    display: block;
    width: 100%;
    min-height: 52px;
    font-size: 19px;
    font-weight: bold;
    letter-spacing: 3px;
    color: #1a1200;
    background: #ffb000;
    border: none;
    border-radius: 8px;
    padding: 14px 0;
    margin-bottom: 10px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { background: #ffd34d; }
  .btn-sub {
    background: #241a00;
    color: #ffb000;
    border: 2px solid #ffb000;
  }
  .btn-sub:active { background: #3a2b00; }
  .msg {
    min-height: 20px;
    font-size: 14px;
    color: #cc8f00;
    text-align: center;
    letter-spacing: 1px;
  }
  .footer {
    margin-top: 16px;
    text-align: center;
  }
  .portal-link {
    display: block;
    min-height: 52px;
    line-height: 52px;
    font-size: 17px;
    font-weight: bold;
    letter-spacing: 2px;
    color: #ffb000;
    background: #141414;
    border: 2px solid #4d3800;
    border-radius: 8px;
    text-decoration: none;
    margin-bottom: 10px;
  }
  .credit {
    font-size: 12px;
    color: #7a5c06;
    letter-spacing: 1px;
    line-height: 1.6;
  }
  .tt-section {
    margin-top: 18px;
    border: 2px solid #4d3800;
    border-radius: 8px;
    background: #0a0800;
    padding: 10px 8px;
  }
  .tt-title {
    font-size: 19px;
    font-weight: bold;
    letter-spacing: 2px;
    color: #ffd34d;
    text-align: center;
    margin-bottom: 4px;
  }
  .tt-note {
    font-size: 12px;
    color: #cc8f00;
    text-align: center;
    letter-spacing: 1px;
    line-height: 1.6;
    margin-bottom: 8px;
  }
  .tt-dir {
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 2px;
    color: #ffd34d;
    border-bottom: 1px dashed #4d3800;
    padding-bottom: 3px;
    margin: 10px 0 6px;
  }
  .tt-next-row {
    display: table;
    width: 100%;
    font-family: "Courier New", monospace;
    font-size: 20px;
    font-weight: bold;
    color: #ffb000;
    text-shadow: 0 0 6px rgba(255, 176, 0, 0.55);
    padding: 5px 0;
    border-bottom: 1px solid #1c1400;
  }
  .tt-next-row span { display: table-cell; }
  .tt-cd { text-align: right; color: #ffd34d; font-size: 17px; }
  .tt-list {
    max-height: 240px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    border: 1px solid #241a00;
    border-radius: 6px;
    padding: 4px 8px;
    background: #000;
  }
  .tt-item {
    display: inline-block;
    font-family: "Courier New", monospace;
    font-size: 16px;
    color: #cc8f00;
    margin: 3px 8px 3px 0;
    letter-spacing: 1px;
  }
  .tt-item.next {
    color: #1a1200;
    background: #ffb000;
    font-weight: bold;
    border-radius: 4px;
    padding: 1px 6px;
    text-shadow: none;
  }
  .tt-ended {
    font-size: 15px;
    color: #cc8f00;
    letter-spacing: 1px;
    padding: 4px 0;
  }
</style>
</head>
<body>

<div class="station-sign">
  <div class="station-name">だっくす駅</div>
  <div class="station-sub">EKIMA-6 発車案内 / DAKKUSU STATION</div>
</div>

<div class="board">
  <div class="board-head">
    <span class="c-time">時刻</span><span class="c-type">種別</span><span class="c-dest">行き先</span><span class="c-home">ホーム</span>
  </div>
  <div id="boardRows"></div>
</div>

<div class="countdown-box">
  <div class="countdown-label">次の発車まで</div>
  <div class="countdown-next" id="nextInfo">―</div>
  <div class="countdown-time" id="countdown">--:--</div>
</div>

<div class="buttons">
  <button class="btn" id="btnRefresh" type="button">更 新</button>
  <button class="btn btn-sub" id="btnSpeak" type="button">発車案内（音声）</button>
</div>
<div class="msg" id="msg"></div>

<div class="tt-section">
  <div class="tt-title">ふじみ野駅 本物の時刻表（目安）</div>
  <div class="tt-note">東武東上線 ふじみ野駅・平日パターンダイヤ<br>※パターンダイヤによる目安です。実際の時刻表・運行情報とは異なります</div>
  <div class="tt-dir">上り（池袋方面）</div>
  <div id="ttUpNext"></div>
  <div class="tt-list" id="ttUpList"></div>
  <div class="tt-dir">下り（川越・寄居方面）</div>
  <div id="ttDownNext"></div>
  <div class="tt-list" id="ttDownList"></div>
</div>

<div class="footer">
  <a class="portal-link" href="https://9rdyzkr686-png.github.io/sora-field-scanner/portal/">全サイト一覧へ</a>
  <div class="credit">※「だっくす駅」は架空の駅です。実際の鉄道の運行情報ではありません。<br>EKIMA-6</div>
</div>

<script>
var DESTS = ["池袋", "川越", "志木", "ふじみ野", "朝霞台", "和光市", "成増", "小川町"];
var TYPES = ["普通", "急行", "準急", "特急"];
var SPECIALS = [
  { type: "特急", dest: "月行き" },
  { type: "普通", dest: "海底行き" },
  { type: "回送", dest: "昭和行き" }
];
var board = [];
var timerId = null;

function pad2(n) {
  return (n < 10 ? "0" : "") + n;
}

function fmtTime(d) {
  return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}

function randInt(min, max) {
  return min + Math.floor(Math.random() * (max - min + 1));
}

function buildBoard() {
  var now = new Date();
  var count = randInt(6, 8);
  var offsets = [];
  var t = randInt(3, 6);
  var i;
  for (i = 0; i < count; i++) {
    offsets.push(t);
    t += randInt(4, 8);
    if (t > 45) { t = 45; }
  }
  board = [];
  for (i = 0; i < count; i++) {
    var dep = new Date(now.getTime() + offsets[i] * 60000);
    dep.setSeconds(0, 0);
    board.push({
      time: dep,
      type: TYPES[randInt(0, TYPES.length - 1)],
      dest: DESTS[randInt(0, DESTS.length - 1)],
      home: randInt(1, 3),
      special: false
    });
  }
  /* たまに特別列車を差し込む */
  if (Math.random() < 0.3) {
    var sp = SPECIALS[randInt(0, SPECIALS.length - 1)];
    var pos = randInt(0, board.length - 1);
    board[pos].type = sp.type;
    board[pos].dest = sp.dest;
    board[pos].special = true;
  }
  renderBoard();
  updateCountdown();
}

function renderBoard() {
  var html = "";
  var i;
  for (i = 0; i < board.length; i++) {
    var r = board[i];
    html += '<div class="row' + (r.special ? " special" : "") + '">'
      + '<span class="c-time">' + fmtTime(r.time) + '</span>'
      + '<span class="c-type">' + r.type + '</span>'
      + '<span class="c-dest">' + r.dest + '</span>'
      + '<span class="c-home">' + r.home + '番線</span>'
      + '</div>';
  }
  document.getElementById("boardRows").innerHTML = html;
}

function updateCountdown() {
  if (board.length === 0) { return; }
  var next = board[0];
  var now = new Date();
  var diff = Math.floor((next.time.getTime() - now.getTime()) / 1000);
  var info = fmtTime(next.time) + " " + next.type + " " + next.dest + "行き";
  document.getElementById("nextInfo").textContent = info;
  if (diff <= 0) {
    document.getElementById("countdown").textContent = "発車！";
    buildBoard();
    return;
  }
  var m = Math.floor(diff / 60);
  var s = diff % 60;
  document.getElementById("countdown").textContent = pad2(m) + ":" + pad2(s);
}

function speakNext() {
  var msgEl = document.getElementById("msg");
  if (board.length === 0) { return; }
  if (!("speechSynthesis" in window)) {
    msgEl.textContent = "この端末では音声案内が使えません";
    return;
  }
  try {
    window.speechSynthesis.cancel();
    var next = board[0];
    var text = "まもなく、" + next.home + "番線から、"
      + fmtTime(next.time) + "発、" + next.type + "、"
      + next.dest + "行きが発車いたします。";
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "ja-JP";
    u.rate = 0.95;
    window.speechSynthesis.speak(u);
    msgEl.textContent = "発車案内を再生中…";
  } catch (e) {
    msgEl.textContent = "音声案内を開始できませんでした";
  }
}

document.getElementById("btnRefresh").addEventListener("click", function () {
  buildBoard();
  document.getElementById("msg").textContent = "案内板を更新しました";
});
document.getElementById("btnSpeak").addEventListener("click", speakNext);

buildBoard();
timerId = window.setInterval(updateCountdown, 1000);

/* ==== ふじみ野駅 パターンダイヤ時刻表（目安） ==== */
/* dir: "up"=上り（池袋方面）, "down"=下り（川越・寄居方面） */
function ttMinutesFor(dir, hour) {
  if (hour === 5) {
    return dir === "up" ? [5, 25, 45] : [12, 32, 52];
  }
  if (hour === 6) {
    return dir === "up" ? [2, 17, 32, 47] : [5, 20, 35, 50];
  }
  if (hour >= 7 && hour <= 21) {
    return dir === "up" ? [3, 13, 23, 33, 43, 53] : [7, 17, 27, 37, 47, 57];
  }
  if (hour === 22 || hour === 23) {
    return dir === "up" ? [0, 15, 30, 45] : [8, 23, 38, 53];
  }
  if (hour === 24) {
    return dir === "up" ? [3, 23, 43] : [10, 30, 50];
  }
  return [];
}

function ttBuildDay(dir) {
  var list = [];
  var h, mins, i;
  for (h = 5; h <= 24; h++) {
    mins = ttMinutesFor(dir, h);
    for (i = 0; i < mins.length; i++) {
      list.push(h * 60 + mins[i]);
    }
  }
  return list;
}

function ttFmt(absMin) {
  var h = Math.floor(absMin / 60);
  var m = absMin % 60;
  return pad2(h) + ":" + pad2(m);
}

var TT_UP = ttBuildDay("up");
var TT_DOWN = ttBuildDay("down");

function ttRenderDir(list, nextElId, listElId) {
  var now = new Date();
  var nowMs = ((now.getHours() * 60 + now.getMinutes()) * 60 + now.getSeconds()) * 1000;
  var nextIdx = -1;
  var i;
  for (i = 0; i < list.length; i++) {
    if (list[i] * 60000 > nowMs) { nextIdx = i; break; }
  }
  var nextHtml = "";
  if (nextIdx < 0) {
    nextHtml = '<div class="tt-ended">本日の列車は終了しました</div>';
  } else {
    var shown = 0;
    for (i = nextIdx; i < list.length && shown < 3; i++) {
      var diffMs = list[i] * 60000 - nowMs;
      var cdMin = Math.ceil(diffMs / 60000);
      var cdText = cdMin <= 1 ? "まもなく" : "あと" + cdMin + "分";
      nextHtml += '<div class="tt-next-row"><span>' + ttFmt(list[i]) + '</span>'
        + '<span class="tt-cd">' + cdText + '</span></div>';
      shown++;
    }
  }
  document.getElementById(nextElId).innerHTML = nextHtml;
  var listHtml = "";
  for (i = 0; i < list.length; i++) {
    listHtml += '<span class="tt-item' + (i === nextIdx ? " next" : "") + '">'
      + ttFmt(list[i]) + '</span>';
  }
  document.getElementById(listElId).innerHTML = listHtml;
}

function ttRenderAll() {
  ttRenderDir(TT_UP, "ttUpNext", "ttUpList");
  ttRenderDir(TT_DOWN, "ttDownNext", "ttDownList");
}

ttRenderAll();
window.setInterval(ttRenderAll, 30000);
</script>
</body>
</html>
