<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AI-6 おしゃべりゲームセンター</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { background:#04040e; }
  body {
    color:#eaf6ff; font-family:"Courier New", monospace;
    padding:12px 10px 24px; max-width:640px; margin:0 auto;
  }
  .marquee {
    border:4px double #ff2fd6; background:#0a0a22; text-align:center;
    padding:12px 8px 10px; margin-bottom:10px;
    box-shadow:0 0 14px rgba(255,47,214,.35), inset 0 0 18px rgba(0,229,255,.12);
  }
  h1 { font-size:23px; color:#00e5ff; letter-spacing:2px; text-shadow:0 0 10px rgba(0,229,255,.8), 0 0 22px rgba(0,229,255,.35); }
  h1 .sub { color:#ffe600; font-size:14px; letter-spacing:1px; text-shadow:0 0 8px rgba(255,230,0,.55); }
  .coin { color:#ffe600; font-size:15px; letter-spacing:4px; margin-top:8px; text-shadow:0 0 8px rgba(255,230,0,.7); }
  @-webkit-keyframes blink { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
  @keyframes blink { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
  .blink { -webkit-animation:blink 1.2s steps(1) infinite; animation:blink 1.2s steps(1) infinite; }
  .desc { font-size:14px; color:#a9bde0; margin:6px 0 10px; line-height:1.6; }

  .panel { border:3px double #00e5ff; background:rgba(8,10,34,.55); padding:10px; margin-bottom:10px; box-shadow:inset 0 0 14px rgba(0,229,255,.08); }
  .panel-title { font-size:13px; color:#ffe600; letter-spacing:2px; border-bottom:1px dashed #00e5ff; padding-bottom:4px; margin-bottom:8px; text-shadow:0 0 6px rgba(255,230,0,.45); }

  .chiprow { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .chiprow:last-child { margin-bottom:0; }
  button {
    background:#0a0a26; color:#c8fbff; border:2px solid #00e5ff;
    font-family:inherit; font-size:15px; cursor:pointer; padding:8px 10px; min-height:48px;
    box-shadow:0 3px 0 #065a6e;
  }
  button.active { background:#ff2fd6; color:#fff; font-weight:bold; border-color:#ffe600; box-shadow:0 3px 0 #7a5a00, 0 0 10px rgba(255,47,214,.55); }
  button:active { background:#173a5e; }
  button:disabled { opacity:.45; cursor:default; }
  .mchip { flex:1 1 30%; }
  .qchip { flex:1 1 45%; font-size:14px; border-color:#7a5fd0; color:#e6dcff; box-shadow:0 3px 0 #372a66; }

  #logBox { min-height:220px; }
  .row { margin-bottom:12px; line-height:1.6; }
  .row .who { font-size:12px; letter-spacing:1px; margin-bottom:2px; }
  .row .msg { font-size:17px; white-space:pre-wrap; word-break:break-word; }
  .row.user { text-align:right; }
  .row.user .who { color:#00e5ff; }
  .row.user .msg {
    display:inline-block; text-align:left; color:#eafcff;
    background:rgba(0,50,80,.5); border:2px solid #00e5ff;
    padding:8px 10px; max-width:88%;
  }
  .row.ai { text-align:left; }
  .row.ai .who { color:#ff7ae9; }
  .row.ai .msg {
    display:inline-block; color:#fdfaff;
    background:rgba(46,0,54,.5); border:2px solid #ff2fd6;
    padding:8px 10px; max-width:88%;
  }
  .row.ai .msg.thinking { color:#ffe600; border-color:#ffe600; background:rgba(46,38,0,.45); }
  .row.ai .msg.error { color:#ffb3ab; border-color:#ff5252; background:rgba(54,8,8,.5); }
  body.sora .row.ai .who { color:#33ff66; }
  body.sora .row.ai .msg {
    background:#000; color:#33ff66; border:1px solid #33ff66;
    text-shadow:0 0 6px rgba(51,255,102,.55);
  }
  body.sora .row.ai .msg.thinking { color:#ffb000; border-color:#ffb000; background:#000; text-shadow:0 0 6px rgba(255,176,0,.55); }
  body.sora .row.ai .msg.error { color:#ff8a80; border-color:#ff8a80; background:#000; text-shadow:none; }
  .row.sys { text-align:center; }
  .row.sys .msg { font-size:13px; color:#9fb8a6; }

  .inputrow { display:flex; gap:6px; margin-bottom:10px; }
  #inputBox {
    flex:1 1 auto; min-width:0; min-height:52px; font-size:17px; font-family:inherit;
    background:#07071c; color:#f2feff; border:2px solid #00e5ff; padding:10px;
  }
  #sendBtn { flex:0 0 92px; min-height:52px; font-size:17px; font-weight:bold; background:#ff2fd6; color:#fff; border-color:#ffe600; box-shadow:0 3px 0 #7a5a00; }
  #sendBtn:disabled { background:#2a1030; border-color:#5e2a52; color:#9a7d94; box-shadow:none; }

  .utilrow { display:flex; gap:6px; flex-wrap:wrap; }
  .utilrow button { flex:1 1 30%; font-size:14px; }
  #statusLine { font-size:13px; color:#a9bde0; min-height:18px; margin-top:6px; line-height:1.5; }

  footer { font-size:13px; color:#7d8fb8; margin-top:14px; line-height:1.7; }
  .ver { color:#ffe600; letter-spacing:3px; margin-top:8px; text-shadow:0 0 6px rgba(255,230,0,.45); }
  .portal-link {
    display:block; text-align:center; text-decoration:none;
    border:3px double #00e5ff; color:#c8fbff; background:#0a0a26;
    padding:12px; font-size:16px; margin-top:10px; min-height:48px;
  }
</style>
</head>
<body>

<div class="marquee">
<h1>AI-6 <span class="sub">おしゃべりゲームセンター</span></h1>
<div class="coin blink">★ INSERT COIN ★</div>
</div>
<p class="desc">自由に文章を送ると、AIが返事をします。モードを変えると、相手の性格が変わります。</p>

<div class="panel">
  <div class="panel-title">MODE / モード</div>
  <div class="chiprow" id="modeRow">
    <button type="button" class="mchip active" data-mode="normal">ふつう</button>
    <button type="button" class="mchip" data-mode="chat">雑談</button>
    <button type="button" class="mchip" data-mode="doctor">ダックス博士</button>
    <button type="button" class="mchip" data-mode="fortune">占い師</button>
    <button type="button" class="mchip" data-mode="story">昔話</button>
    <button type="button" class="mchip" data-mode="sora">KUU-01</button>
    <button type="button" class="mchip" data-mode="english">英語練習</button>
  </div>
  <div class="chiprow">
    <button type="button" id="voiceBtn">ボイス：OFF</button>
  </div>
</div>

<div class="panel">
  <div class="panel-title">QUICK / すぐ聞く</div>
  <div class="chiprow">
    <button type="button" class="qchip" data-q="ダックスフンドの豆知識を1つ教えてください。">ダックスの豆知識を教えて</button>
    <button type="button" class="qchip" data-q="なぞなぞを1つ出してください。答えはまだ言わないでください。">なぞなぞを出して</button>
    <button type="button" class="qchip" data-q="短い昔話をしてください。">短い昔話をして</button>
    <button type="button" class="qchip" data-q="今日の運勢を占ってください。">今日の運勢を占って</button>
    <button type="button" class="qchip" data-q="宇宙の不思議な話を1つ教えてください。">宇宙の不思議を教えて</button>
  </div>
</div>

<div class="panel">
  <div class="panel-title">CHAT / 会話</div>
  <div id="logBox"></div>
</div>

<div class="inputrow">
  <input type="text" id="inputBox" placeholder="ここに書いて送信" autocomplete="off">
  <button type="button" id="sendBtn">送信</button>
</div>

<div class="utilrow">
  <button type="button" id="copyBtn">会話をコピー</button>
  <button type="button" id="clearBtn">会話を消す</button>
</div>
<div id="statusLine"></div>

<footer>
  AIの相手は無料の外部AIサービスです（クーではありません）。1日100回くらいまでが目安です。会話はこの端末に自動保存されます。
  <div class="ver">AI-6 v3</div>
  <a class="portal-link" href="https://9rdyzkr686-png.github.io/sora-field-scanner/portal/">全サイト一覧へ</a>
</footer>

<script>
var API_BASE = "https://text.pollinations.ai/";
var GREETING = "こんにちは、小野さん。AI-6です。何でも聞いてください。";
var FAIL_MSG = "AI回線が混み合っています。少し待って、もう一度送ってみてください。";
var QUOTA_MSG = "本日の無料AI回線は上限に達しました。明日の朝9時に回復します";
var TIMEOUT_MSG = "AIの返事が時間切れになりました（90秒）。もう一度送ってみてください";

var MODES = {
  normal:  { label: "ふつう",       inst: "あなたは親切なAIアシスタントです。丁寧で簡潔に答えてください。" },
  chat:    { label: "雑談",         inst: "あなたは明るくフレンドリーな話し相手です。楽しく、短めに答えてください。" },
  doctor:  { label: "ダックス博士", inst: "あなたはダックスフンドにくわしい博士です。博士らしい口調で、ダックスフンドの知識を交えて答えてください。" },
  fortune: { label: "占い師",       inst: "あなたは神秘的な口調の占い師です。占いとして楽しく答えてください。これはエンターテイメントです。" },
  story:   { label: "昔話",         inst: "あなたは昔話の語り部です。「むかしむかし」で始まる、短い創作の昔話を語ってください。" },
  sora:    { label: "KUU-01",      inst: "あなたは観測生物KUU-01です。オリジナルのクー（親）の子どもです。1980年代パソコン風のレトロな端末口調で答えてください。相手は観察者の小野さんです。「小野さん」と呼びかけてください。" },
  english: { label: "英語練習",     inst: "あなたは日本人の初心者のための英語会話の練習相手です。主にやさしく短い英語で答えてください（短い文を3文まで）。その後に、括弧書きで短い日本語訳を添えてください。相手が英語で書いた場合は、日本語で短い添削のヒントを1つ添えてください。" }
};
var COMMON_RULES = "必ず日本語で答えてください。マークダウン記号（#、*、-、番号リストなど）は使わないでください。改行は控えめにしてください。";
var ENG_RULES = "マークダウン記号（#、*、-、番号リストなど）は使わないでください。改行は控えめにしてください。";

var SAVE_KEY = "ai6_save_v1";
var mode = "normal";
var voiceOn = false;
var sending = false;
var history = []; /* [{u:"...", a:"..."}] 直近のやりとり */
var chatMsgs = []; /* [{r:"u"|"a", t:"..."}] 保存・復元用の全メッセージ */

function trimMsgs() {
  while (chatMsgs.length > 50) chatMsgs.shift();
}

function saveChat() {
  try {
    var data = { mode: mode, msgs: chatMsgs.slice(-50) };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  } catch (e) { /* 保存できなくても通常動作を続ける */ }
}

function loadSave() {
  try {
    var raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    var d = JSON.parse(raw);
    if (!d || !d.msgs || typeof d.msgs.length !== "number" || d.msgs.length === 0) return null;
    return d;
  } catch (e) { return null; }
}

var logBox = document.getElementById("logBox");
var inputBox = document.getElementById("inputBox");
var sendBtn = document.getElementById("sendBtn");
var statusEl = document.getElementById("statusLine");
var voiceBtn = document.getElementById("voiceBtn");

function setStatus(t) { statusEl.innerHTML = t; }

function scrollToBottom() {
  try { window.scrollTo(0, document.body.scrollHeight); } catch (e) { /* ignore */ }
}

function addRow(cls, who, text) {
  var row = document.createElement("div");
  row.className = "row " + cls;
  if (who) {
    var w = document.createElement("div");
    w.className = "who";
    w.innerHTML = who;
    row.appendChild(w);
  }
  var m = document.createElement("div");
  m.className = "msg";
  m.innerHTML = text;
  row.appendChild(m);
  logBox.appendChild(row);
  scrollToBottom();
  return m;
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function addUserRow(text) { return addRow("user", "あなた", esc(text)); }
function addAiRow(text) { return addRow("ai", "AI", esc(text)); }
function addSysRow(text) { return addRow("sys", "", esc(text)); }

function speak(text) {
  if (!voiceOn) return;
  try {
    if (!window.speechSynthesis) return;
    if (text.length > 150) return;
    if (text.indexOf("\n") >= 0) return;
    var u = new SpeechSynthesisUtterance(text);
    u.lang = (mode === "english") ? "en-US" : "ja-JP";
    u.pitch = 0.7;
    u.rate = 1.0;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  } catch (e) { /* ignore */ }
}

/* ---- typewriter ---- */
var typeTimer = null;
var typeTarget = null;
var typeFull = "";
var typePos = 0;

function finishTyping() {
  if (typeTimer) { clearInterval(typeTimer); typeTimer = null; }
  if (typeTarget) {
    typeTarget.innerHTML = esc(typeFull);
    typeTarget = null;
  }
  scrollToBottom();
}

function startTyping(msgEl, fullText) {
  finishTyping();
  typeTarget = msgEl;
  typeFull = fullText;
  typePos = 0;
  msgEl.innerHTML = "";
  typeTimer = setInterval(function () {
    if (!typeTarget) {
      if (typeTimer) { clearInterval(typeTimer); typeTimer = null; }
      return;
    }
    typePos += 1;
    if (typePos >= typeFull.length) {
      typeTarget.innerHTML = esc(typeFull);
      if (typeTimer) { clearInterval(typeTimer); typeTimer = null; }
      typeTarget = null;
    } else {
      typeTarget.innerHTML = esc(typeFull.substring(0, typePos));
    }
    scrollToBottom();
  }, 15);
}

function buildPrompt(userText) {
  var inst = MODES[mode].inst;
  var limit;
  if (mode === "sora") limit = "100文字以内で答えてください。";
  else if (mode === "chat") limit = "150文字以内で答えてください。";
  else limit = "300文字以内で答えてください。";
  var p = inst + (mode === "english" ? ENG_RULES : COMMON_RULES) + limit;
  var i, h;
  var from = Math.max(0, history.length - 3);
  if (from < history.length) {
    p += " これまでの会話：";
    for (i = from; i < history.length; i++) {
      h = history[i];
      p += " あなた：" + h.u.substring(0, 120) + " / AI：" + h.a.substring(0, 120) + "。";
    }
  }
  p += " 新しい質問：" + userText;
  return p;
}

function sendMessage(text) {
  text = (text || "").replace(/^\s+|\s+$/g, "");
  if (!text || sending) return;
  finishTyping();
  sending = true;
  sendBtn.disabled = true;
  inputBox.value = "";
  addUserRow(text);
  chatMsgs.push({ r: "u", t: text });
  trimMsgs();
  saveChat();
  var thinkMsg = addRow("ai", "AI", "考え中…");
  thinkMsg.className = "msg thinking";

  var done = false;
  var retried = false;
  var retrying = false;
  var elapsed = 0;
  var waitTimer = setInterval(function () {
    elapsed += 1;
    thinkMsg.innerHTML = "考え中… " + elapsed + "秒" + (retrying ? "（再試行中）" : "");
  }, 1000);

  function stopWait() {
    if (waitTimer) { clearInterval(waitTimer); waitTimer = null; }
  }
  var lastKind = "http";
  var lastStatus = 0;
  function finalFail(msg, detail) {
    if (done) return;
    done = true;
    stopWait();
    thinkMsg.className = "msg error";
    var html = esc(msg);
    if (detail) html += " <span style=\"font-size:12px\">（詳細：" + esc(detail) + "）</span>";
    thinkMsg.innerHTML = html;
    sending = false;
    sendBtn.disabled = false;
    scrollToBottom();
  }
  function failOrRetry(kind, status) {
    if (done) return;
    lastKind = kind;
    if (typeof status === "number") lastStatus = status;
    if (kind === "quota") { finalFail(QUOTA_MSG, ""); return; }
    if (!retried) {
      retried = true;
      retrying = true;
      thinkMsg.innerHTML = "考え中… " + elapsed + "秒（再試行中）";
      setTimeout(function () { if (!done) attempt(); }, 2000);
    } else if (kind === "timeout") {
      finalFail(TIMEOUT_MSG, "");
    } else {
      finalFail(FAIL_MSG, "HTTP " + lastStatus);
    }
  }
  function succeed(reply) {
    if (done) return;
    done = true;
    stopWait();
    thinkMsg.className = "msg";
    history.push({ u: text, a: reply });
    if (history.length > 12) history.shift();
    chatMsgs.push({ r: "a", t: reply });
    trimMsgs();
    saveChat();
    sending = false;
    sendBtn.disabled = false;
    startTyping(thinkMsg, reply);
    speak(reply);
  }
  function attempt() {
    try {
      var xhr = new XMLHttpRequest();
      xhr.open("POST", API_BASE, true);
      xhr.setRequestHeader("Content-Type", "application/json");
      xhr.timeout = 90000;
      xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4) return;
        if (done) return;
        var st = 0;
        try { st = xhr.status; } catch (e) { st = 0; }
        var raw = "";
        try { raw = xhr.responseText || ""; } catch (e) { raw = ""; }
        if (st === 402 || raw.indexOf("Free limit") >= 0) { failOrRetry("quota", st); return; }
        if (st !== 200) { failOrRetry("http", st); return; }
        var body = raw.replace(/^\s+|\s+$/g, "");
        if (!body) { failOrRetry("http", st); return; }
        succeed(body);
      };
      xhr.ontimeout = function () { failOrRetry("timeout", 0); };
      xhr.onerror = function () {
        var st2 = 0;
        try { st2 = xhr.status; } catch (e) { st2 = 0; }
        failOrRetry("http", st2);
      };
      xhr.send(JSON.stringify({ messages: [{ role: "user", content: buildPrompt(text) }], model: "openai-fast" }));
    } catch (e) {
      failOrRetry("http", 0);
    }
  }
  attempt();
}

sendBtn.onclick = function () { sendMessage(inputBox.value); };
inputBox.onkeydown = function (e) {
  if (e.keyCode === 13) { sendMessage(inputBox.value); }
};

/* mode chips */
var modeRow = document.getElementById("modeRow");
var mchips = modeRow.getElementsByTagName("button");
var mi;
for (mi = 0; mi < mchips.length; mi++) {
  mchips[mi].onclick = function () {
    var m = this.getAttribute("data-mode");
    if (m === mode) return;
    finishTyping();
    mode = m;
    document.body.className = (m === "sora") ? "sora" : "";
    var q;
    for (q = 0; q < mchips.length; q++) {
      mchips[q].className = "mchip" + (mchips[q].getAttribute("data-mode") === m ? " active" : "");
    }
    addSysRow("モードを『" + MODES[m].label + "』に変えました");
    saveChat();
  };
}

/* quick chips */
var qchips = document.getElementsByClassName("qchip");
var qi;
for (qi = 0; qi < qchips.length; qi++) {
  qchips[qi].onclick = function () { sendMessage(this.getAttribute("data-q")); };
}

voiceBtn.onclick = function () {
  voiceOn = !voiceOn;
  voiceBtn.innerHTML = "ボイス：" + (voiceOn ? "ON" : "OFF");
  voiceBtn.className = voiceOn ? "active" : "";
  if (!voiceOn) {
    try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) { /* ignore */ }
  }
};

document.getElementById("copyBtn").onclick = function () {
  finishTyping();
  var lines = [], i;
  lines.push("AI: " + GREETING);
  for (i = 0; i < logBox.childNodes.length; i++) {
    var row = logBox.childNodes[i];
    if (!row.className) continue;
    var msgEl = null, j;
    for (j = 0; j < row.childNodes.length; j++) {
      if (row.childNodes[j].className === "msg" || (row.childNodes[j].className || "").indexOf("msg") === 0) msgEl = row.childNodes[j];
    }
    if (!msgEl) continue;
    var t = msgEl.innerHTML.replace(/<[^>]*>/g, "");
    if (row.className.indexOf("user") >= 0) lines.push("あなた: " + t);
    else if (row.className.indexOf("sys") >= 0) lines.push("（" + t + "）");
    else lines.push("AI: " + t);
  }
  var txt = lines.join("\n");
  var ok = false;
  try {
    var ta = document.createElement("textarea");
    ta.value = txt;
    ta.style.position = "absolute";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.select();
    ok = document.execCommand("copy");
    document.body.removeChild(ta);
  } catch (e) { ok = false; }
  setStatus(ok ? "会話をコピーしました。" : "コピーできませんでした。");
};

document.getElementById("clearBtn").onclick = function () {
  if (typeTimer) { clearInterval(typeTimer); typeTimer = null; }
  typeTarget = null;
  history = [];
  chatMsgs = [];
  try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ }
  logBox.innerHTML = "";
  addAiRow(GREETING);
  setStatus("会話を消しました。");
  try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) { /* ignore */ }
};

/* ---- 起動時：保存があれば復元、なければ挨拶 ---- */
var savedData = loadSave();
if (savedData) {
  var sIdx, sMsg;
  for (sIdx = 0; sIdx < savedData.msgs.length; sIdx++) {
    sMsg = savedData.msgs[sIdx];
    if (sMsg && (sMsg.r === "u" || sMsg.r === "a") && typeof sMsg.t === "string") {
      chatMsgs.push({ r: sMsg.r, t: sMsg.t });
    }
  }
  trimMsgs();
}
if (chatMsgs.length > 0) {
  if (savedData.mode && MODES[savedData.mode]) {
    mode = savedData.mode;
    document.body.className = (mode === "sora") ? "sora" : "";
    var mIdx;
    for (mIdx = 0; mIdx < mchips.length; mIdx++) {
      mchips[mIdx].className = "mchip" + (mchips[mIdx].getAttribute("data-mode") === mode ? " active" : "");
    }
  }
  var rIdx, pendingU = null;
  for (rIdx = 0; rIdx < chatMsgs.length; rIdx++) {
    if (chatMsgs[rIdx].r === "u") {
      addUserRow(chatMsgs[rIdx].t);
      pendingU = chatMsgs[rIdx].t;
    } else {
      addAiRow(chatMsgs[rIdx].t);
      if (pendingU !== null) {
        history.push({ u: pendingU, a: chatMsgs[rIdx].t });
        pendingU = null;
      }
    }
  }
  if (history.length > 12) history = history.slice(history.length - 12);
  addSysRow("前回の会話を復元しました（" + chatMsgs.length + "件）");
} else {
  addAiRow(GREETING);
}
</script>
</body>
</html>
