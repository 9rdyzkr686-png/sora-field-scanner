<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FORTUNE-6 占い横丁</title>
<style>
* { margin:0; padding:0; box-sizing:border-box;}
body { background:#160f1e; color:#ffe9c9; font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans",sans-serif; font-size:17px; line-height:1.5; padding:10px 10px 40px;}
a { color:#ffb85c;}
.backlink { display:inline-block; padding:10px 4px; font-size:16px; text-decoration:none;}
h1 { text-align:center; font-size:30px; letter-spacing:4px; color:#ffd98a; text-shadow:0 0 12px #ff8c3a; margin:6px 0 2px;}
.sub { text-align:center; color:#e8a0bf; font-size:14px; margin-bottom:8px;}
.lanterns { text-align:center; font-size:22px; letter-spacing:10px; margin:4px 0 10px;}
.lanterns.l1 { color:#ff6b6b; text-shadow:0 0 10px #ff6b6b;}
.lanterns.l2 { color:#ffd93d; text-shadow:0 0 10px #ffd93d;}
.lanterns.l3 { color:#6bcbff; text-shadow:0 0 10px #6bcbff;}
.lanterns.l4 { color:#95e06b; text-shadow:0 0 10px #95e06b;}
.voicebar { text-align:center; margin:8px 0 14px;}
button { font-family:inherit; cursor:pointer; border:none; border-radius:12px;}
.voicebtn { background:#3a2350; color:#ffd98a; border:2px solid #ffd98a; font-size:16px; padding:12px 22px; min-height:48px;}
.shopbtn { display:block; width:100%; min-height:64px; margin:10px 0; font-size:21px; font-weight:bold; color:#fff; text-align:left; padding:14px 16px; border-radius:14px; border:2px solid rgba(255,255,255,0.35);}
.shopbtn small { display:block; font-size:14px; font-weight:normal; opacity:0.9; margin-top:2px;}
#shop-ai { background:linear-gradient(90deg,#8e2a4e,#c2452d);}
#shop-num { background:linear-gradient(90deg,#274b8f,#5b2a86);}
#shop-omi { background:linear-gradient(90deg,#a33d12,#c98a1b);}
#shop-tarot { background:linear-gradient(90deg,#1e6b52,#274b8f);}
.panel { display:none; background:#241631; border:2px solid #6b4a8f; border-radius:14px; padding:16px 14px; margin-top:6px;}
.panel h2 { font-size:22px; color:#ffd98a; margin-bottom:10px; text-align:center;}
.bigbtn { display:block; width:100%; min-height:56px; font-size:20px; font-weight:bold; background:#ff8c3a; color:#2a1400; padding:14px; margin:12px 0;}
.bigbtn:disabled { background:#5a4632; color:#a08b6d;}
.backbtn { display:block; width:100%; min-height:52px; font-size:18px; background:#3a2350; color:#ffd98a; border:2px solid #ffd98a; padding:12px; margin-top:16px;}
.result { background:#120a1c; border:1px solid #8f6bb8; border-radius:10px; padding:14px; min-height:60px; font-size:18px; white-space:pre-wrap; word-break:break-word;}
.status { text-align:center; color:#e8a0bf; font-size:15px; min-height:22px; margin:8px 0;}
.detail { text-align:center; color:#9a86b8; font-size:13px;}
input[type="tel"] { width:100%; font-size:22px; padding:14px; min-height:56px; border-radius:10px; border:2px solid #8f6bb8; background:#120a1c; color:#ffe9c9; text-align:center; letter-spacing:4px;}
label { display:block; font-size:15px; color:#e8a0bf; margin:6px 0;}
.cards { text-align:center; margin:14px 0;}
.cardbtn { display:inline-block; width:30%; min-height:110px; margin:0 1%; font-size:34px; background:linear-gradient(160deg,#3a2350,#241631); color:#ffd98a; border:2px solid #ffd98a; vertical-align:top; padding:10px 4px;}
.cardbtn small { display:block; font-size:13px; margin-top:6px;}
.cardbtn:disabled { opacity:0.45;}
.omikuji-rank { font-size:34px; text-align:center; color:#ffd93d; text-shadow:0 0 10px #ff8c3a;}
footer { text-align:center; color:#9a86b8; font-size:13px; margin-top:26px;}
</style>
</head>
<body>
<a class="backlink" href="../portal/">← 全サイト一覧へ</a>
<h1>占い横丁</h1>
<div class="sub">FORTUNE-6 〜 夜市の占い屋台 〜</div>
<div class="lanterns"><span class="l1">●</span><span class="l2">●</span><span class="l3">●</span><span class="l4">●</span><span class="l1">●</span><span class="l2">●</span></div>
<div class="voicebar"><button class="voicebtn" id="voiceBtn" onclick="toggleVoice()">ボイス：ON</button></div>

<div id="menu">
<button class="shopbtn" id="shop-ai" onclick="openShop('ai')">🔮 AI占い屋<small>今日の運勢をAIが占います</small></button>
<button class="shopbtn" id="shop-num" onclick="openShop('num')">🔢 数秘術の店<small>誕生日から運命数を出します</small></button>
<button class="shopbtn" id="shop-omi" onclick="openShop('omi')">🎋 おみくじ屋<small>今日の運試し（1日同じ結果）</small></button>
<button class="shopbtn" id="shop-tarot" onclick="openShop('tarot')">🃏 タロット風の店<small>3枚から1枚選んでAIが読みます</small></button>
</div>

<div class="panel" id="panel-ai">
<h2>🔮 AI占い屋</h2>
<button class="bigbtn" id="aiBtn" onclick="aiFortune()">今日の運勢を占う</button>
<div class="status" id="aiStatus"></div>
<div class="result" id="aiResult">ボタンを押すと、AIが今日の運勢（順位・ラッキーアイテム・ラッキーカラー・一言アドバイス）を占います。</div>
<div class="detail" id="aiDetail"></div>
<button class="backbtn" onclick="closeShops()">もどる</button>
</div>

<div class="panel" id="panel-num">
<h2>🔢 数秘術の店</h2>
<label>誕生日を8ケタで入力してください（例：1990年1月2日 → 19900102）</label>
<input type="tel" id="birthInput" maxlength="8" placeholder="YYYYMMDD">
<button class="bigbtn" id="numBtn" onclick="numerology()">運命数を出す</button>
<div class="status" id="numStatus"></div>
<div class="result" id="numResult">誕生日から「運命数（ライフパスナンバー）」を計算します。</div>
<div class="detail" id="numDetail"></div>
<button class="backbtn" onclick="closeShops()">もどる</button>
</div>

<div class="panel" id="panel-omi">
<h2>🎋 おみくじ屋</h2>
<button class="bigbtn" onclick="omikuji()">おみくじを引く</button>
<div class="result" id="omiResult">ボタンを押しておみくじを引きましょう。今日は何度引いても同じ結果です。</div>
<button class="backbtn" onclick="closeShops()">もどる</button>
</div>

<div class="panel" id="panel-tarot">
<h2>🃏 タロット風の店</h2>
<p style="text-align:center;font-size:15px;color:#e8a0bf;">心を静めて、1枚選んでください。</p>
<div class="cards">
<button class="cardbtn" id="card0" onclick="tarotPick(0)">✦<small>1枚目</small></button><button class="cardbtn" id="card1" onclick="tarotPick(1)">✦<small>2枚目</small></button><button class="cardbtn" id="card2" onclick="tarotPick(2)">✦<small>3枚目</small></button>
</div>
<div class="status" id="tarotStatus"></div>
<div class="result" id="tarotResult">選んだカードをAIが読み解きます（タロット風のAI占いです）。</div>
<div class="detail" id="tarotDetail"></div>
<button class="backbtn" onclick="closeShops()">もどる</button>
</div>

<footer>FORTUNE-6 占い横丁<br>占いは娯楽です。結果は気軽に楽しんでください。</footer>

<script>
var voiceOn = true;

function toggleVoice() {
voiceOn =!voiceOn;
document.getElementById('voiceBtn').innerHTML = voiceOn? 'ボイス：ON': 'ボイス：OFF';
if (!voiceOn && window.speechSynthesis) { speechSynthesis.cancel();}
}

function speak(text) {
if (!voiceOn) { return;}
if (!window.speechSynthesis) { return;}
if (text.indexOf('\n') >= 0) { return;}
if (text.length > 150) { return;}
try {
speechSynthesis.cancel();
var u = new SpeechSynthesisUtterance(text);
u.lang = 'ja-JP';
u.pitch = 0.7;
u.rate = 1.0;
speechSynthesis.speak(u);
} catch (e) {}
}

function openShop(name) {
closeShops();
document.getElementById('menu').style.display = 'none';
document.getElementById('panel-' + name).style.display = 'block';
window.scrollTo(0, 0);
}

function closeShops() {
var names = ['ai', 'num', 'omi', 'tarot'];
for (var i = 0; i < names.length; i++) {
document.getElementById('panel-' + names[i]).style.display = 'none';
}
document.getElementById('menu').style.display = 'block';
}

/* ---- AI transport ---- */
function callAI(prompt, statusId, detailId, btnId, onOk, onDone) {
var statusEl = document.getElementById(statusId);
var detailEl = document.getElementById(detailId);
var btn = btnId? document.getElementById(btnId): null;
if (detailEl) { detailEl.innerHTML = '';}
if (btn) { btn.disabled = true;}
var sec = 0;
statusEl.innerHTML = '考え中… 0秒';
var timer = setInterval(function () {
sec++;
statusEl.innerHTML = '考え中… ' + sec + '秒';
}, 1000);
var xhr = new XMLHttpRequest();
xhr.open('POST', 'https://text.pollinations.ai/', true);
xhr.setRequestHeader('Content-Type', 'application/json');
xhr.timeout = 90000;
xhr.onreadystatechange = function () {
if (xhr.readyState!== 4) { return;}
clearInterval(timer);
if (btn) { btn.disabled = false;}
if (onDone) { onDone();}
if (xhr.status === 200) {
var text = (xhr.responseText || '').replace(/^\s+|\s+$/g, '');
if (text && text.indexOf('Free limit') < 0) {
statusEl.innerHTML = '';
onOk(text);
} else {
statusEl.innerHTML = '本日の無料AI回線は上限に達しました。明日の朝9時に回復します';
}
} else if (xhr.status === 402 || (xhr.responseText && xhr.responseText.indexOf('Free limit') >= 0)) {
statusEl.innerHTML = '本日の無料AI回線は上限に達しました。明日の朝9時に回復します';
} else {
statusEl.innerHTML = 'AI回線が混み合っています';
if (detailEl) { detailEl.innerHTML = '詳細：HTTP ' + xhr.status;}
}
};
xhr.ontimeout = function () {
clearInterval(timer);
if (btn) { btn.disabled = false;}
if (onDone) { onDone();}
statusEl.innerHTML = '時間切れになりました。もう一度お試しください';
};
xhr.onerror = function () {
clearInterval(timer);
if (btn) { btn.disabled = false;}
if (onDone) { onDone();}
statusEl.innerHTML = 'AI回線が混み合っています';
if (detailEl) { detailEl.innerHTML = '詳細：HTTP 0';}
};
var body = JSON.stringify({ messages: [{ role: 'user', content: prompt}], model: 'openai-fast'});
xhr.send(body);
}

/* ---- 1. AI占い屋 ---- */
function aiFortune() {
var prompt = 'あなたは夜市の占い師です。今日の運勢を日本語で150文字以内で占ってください。順位（12位中○位）、ラッキーアイテム、ラッキーカラー、一言アドバイスを必ず入れて、改行せず1行で答えてください。';
callAI(prompt, 'aiStatus', 'aiDetail', 'aiBtn', function (text) {
document.getElementById('aiResult').innerHTML = escapeHtml(text);
speak(text);
});
}

/* ---- 2. 数秘術 ---- */
var NUM_MEANINGS = {
1: 'リーダーの数。自分の道を切り開く力があります。',
2: '調和の数。人と人をつなぐ優しさが武器です。',
3: '創造の数。明るさと表現力で周りを笑顔にします。',
4: '安定の数。コツコツ積み上げる努力家です。',
5: '自由の数。変化と冒険を楽しむ冒険家です。',
6: '愛情の数。家族や仲間を大切にする世話好きです。',
7: '探求の数。物事の本質を見抜く研究者タイプです。',
8: '豊かさの数。目標を形にする実行力があります。',
9: '博愛の数。広い心で人を受け止める癒し手です。',
11: 'ひらめきの数（マスターナンバー）。直感が鋭い感性の人です。',
22: '実現の数（マスターナンバー）。大きな夢を形にできる人です。'
};

function numerology() {
var v = document.getElementById('birthInput').value.replace(/[^0-9]/g, '');
var resultEl = document.getElementById('numResult');
var statusEl = document.getElementById('numStatus');
if (v.length!== 8) {
statusEl.innerHTML = '8ケタで入力してください（例：19900102）';
return;
}
var y = parseInt(v.substring(0, 4), 10);
var m = parseInt(v.substring(4, 6), 10);
var d = parseInt(v.substring(6, 8), 10);
if (m < 1 || m > 12 || d < 1 || d > 31 || y < 1900 || y > 2099) {
statusEl.innerHTML = '正しい誕生日を入力してください';
return;
}
statusEl.innerHTML = '';
var sum = 0;
var i;
for (i = 0; i < 8; i++) { sum += parseInt(v.charAt(i), 10);}
while (sum > 9 && sum!== 11 && sum!== 22) {
var s = '' + sum;
var t = 0;
for (i = 0; i < s.length; i++) { t += parseInt(s.charAt(i), 10);}
sum = t;
}
var meaning = NUM_MEANINGS[sum] || NUM_MEANINGS[9];
resultEl.innerHTML = 'あなたの運命数は ' + sum + ' です\n' + escapeHtml(meaning) + '\n\nAIからの一言を聞いています…';
var prompt = '数秘術で運命数' + sum + '（意味：' + meaning + '）の人への一言コメントを、日本語で60文字以内、改行なしでください。';
callAI(prompt, 'numStatus', 'numDetail', 'numBtn', function (text) {
resultEl.innerHTML = 'あなたの運命数は ' + sum + ' です\n' + escapeHtml(meaning) + '\n\nAIからの一言：' + escapeHtml(text);
speak('運命数は' + sum + 'です。' + text);
});
}

/* ---- 3. おみくじ ---- */
var OMIKUJI = [
{ rank: '大吉', comment: '最高の一日。思い切って行動しましょう。'},
{ rank: '中吉', comment: '良い流れです。小さな幸運が重なります。'},
{ rank: '小吉', comment: 'ささやかな幸せが見つかる日です。'},
{ rank: '吉', comment: '穏やかで良い日。笑顔が福を呼びます。'},
{ rank: '半吉', comment: '半分は運、半分は努力の日です。'},
{ rank: '末吉', comment: '後からじわじわ良くなっていきます。'},
{ rank: '末小吉', comment: '夕方から運気が上がってきます。'},
{ rank: '平', comment: '平穏無事。それも立派な幸運です。'},
{ rank: '小凶', comment: '小さなつまずきに注意。深呼吸を。'},
{ rank: '凶', comment: '今日は慎重に。無理をしないのが吉です。'},
{ rank: '大凶', comment: '嵐の日は家で温かく。明日は晴れます。'}
];

function dateSeed() {
var now = new Date();
return now.getFullYear() * 10000 + (now.getMonth() + 1) * 100 + now.getDate();
}

function omikuji() {
var idx = dateSeed() % OMIKUJI.length;
var o = OMIKUJI[idx];
document.getElementById('omiResult').innerHTML = '<div class="omikuji-rank">' + o.rank + '</div>' + escapeHtml(o.comment);
speak('おみくじは' + o.rank + 'です。' + o.comment);
}

/* ---- 4. タロット風 ---- */
var TAROT_CARDS = ['太陽', '月', '星', '塔', '恋人', '魔術師', '世界', '運命の輪'];
var tarotBusy = false;

function tarotPick(pick) {
if (tarotBusy) { return;}
tarotBusy = true;
var idx = (dateSeed() + pick * 3) % TAROT_CARDS.length;
var card = TAROT_CARDS[idx];
var i;
for (i = 0; i < 3; i++) { document.getElementById('card' + i).disabled = true;}
document.getElementById('tarotResult').innerHTML = 'あなたが選んだカードは「' + card + '」です。AIが読み解いています…';
var prompt = 'タロット風のAI占いです。カード「' + card + '」が出ました。このカードが示す今日のメッセージを、日本語で120文字以内、改行なしで伝えてください。';
callAI(prompt, 'tarotStatus', 'tarotDetail', null, function (text) {
document.getElementById('tarotResult').innerHTML = 'カード「' + card + '」\n' + escapeHtml(text);
speak('カードは' + card + '。' + text);
}, function () {
tarotBusy = false;
for (var j = 0; j < 3; j++) { document.getElementById('card' + j).disabled = false;}
});
}

function escapeHtml(s) {
return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
</script>
</body>
</html>
