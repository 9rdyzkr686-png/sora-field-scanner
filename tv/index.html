<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TV-6 深夜テレビ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a14;
    color: #e8e8f0;
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
    padding: 10px;
    -webkit-text-size-adjust: 100%;
  }
  .portal-link {
    display: inline-block;
    color: #9fd8ff;
    text-decoration: none;
    font-size: 16px;
    padding: 10px 6px;
    min-height: 48px;
    line-height: 28px;
  }
  h1 {
    text-align: center;
    font-size: 22px;
    letter-spacing: 3px;
    color: #ffd76a;
    text-shadow: 0 0 8px #a87800;
    margin: 2px 0 10px 0;
  }
  /* ===== テレビ本体 ===== */
  .tv {
    background: #3a3230;
    border: 4px solid #241e1c;
    border-radius: 26px;
    padding: 16px 14px 14px 14px;
    box-shadow: 0 6px 0 #17120f, inset 0 2px 3px #6b5d55;
    max-width: 560px;
    margin: 0 auto;
  }
  .screen-wrap {
    position: relative;
    background: #000;
    border-radius: 18px;
    border: 3px solid #14100e;
    overflow: hidden;
    box-shadow: inset 0 0 34px rgba(120,200,255,0.25);
  }
  .screen {
    position: relative;
    min-height: 300px;
    padding: 16px 14px 18px 14px;
    background: #06121f;
    color: #dff3ff;
  }
  .screen:after {
    content: "";
    position: absolute;
    left: 0; top: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.045) 0px,
      rgba(255,255,255,0.045) 1px,
      rgba(0,0,0,0.16) 2px,
      rgba(0,0,0,0.16) 3px
    );
    pointer-events: none;
  }
  .noise {
    position: absolute;
    left: 0; top: 0; right: 0; bottom: 0;
    display: none;
    z-index: 5;
    pointer-events: none;
  }
  .noise.on { display: block; }
  .ch-label {
    font-size: 15px;
    color: #7dfc9a;
    letter-spacing: 2px;
    border-bottom: 1px dashed #3d6a4d;
    padding-bottom: 6px;
    margin-bottom: 10px;
  }
  .ai-tag {
    display: inline-block;
    font-size: 12px;
    color: #06121f;
    background: #ffd76a;
    border-radius: 4px;
    padding: 1px 7px;
    margin-left: 8px;
    letter-spacing: 0;
    vertical-align: 2px;
  }
  .data-line {
    font-size: 16px;
    color: #ffe9a8;
    margin-bottom: 10px;
    line-height: 1.5;
    display: none;
  }
  .prog-text {
    font-size: 18px;
    line-height: 1.75;
    white-space: pre-wrap;
    word-break: break-all;
    text-shadow: 0 0 5px rgba(140,220,255,0.55);
  }
  .status-line {
    margin-top: 12px;
    font-size: 14px;
    color: #9fb6c9;
    min-height: 20px;
  }
  .detail-line {
    font-size: 12px;
    color: #71879c;
    min-height: 16px;
  }
  /* ===== 操作パネル ===== */
  .panel {
    margin-top: 14px;
    text-align: center;
  }
  .panel .cap {
    font-size: 13px;
    color: #cbb9a8;
    letter-spacing: 3px;
    margin-bottom: 8px;
  }
  .ch-row { font-size: 0; }
  .ch-btn {
    display: inline-block;
    width: 56px;
    height: 56px;
    margin: 4px;
    font-size: 22px;
    font-weight: bold;
    color: #ffe9a8;
    background: #241e1c;
    border: 3px solid #57493f;
    border-radius: 50%;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .ch-btn.active {
    background: #8a2f1d;
    border-color: #ffb37a;
    color: #fff;
    box-shadow: 0 0 12px rgba(255,140,60,0.8);
  }
  .sub-row { margin-top: 12px; font-size: 0; }
  .ctl-btn {
    display: inline-block;
    min-width: 130px;
    min-height: 48px;
    margin: 4px;
    padding: 10px 14px;
    font-size: 16px;
    color: #e8e8f0;
    background: #2b3a4a;
    border: 2px solid #57718c;
    border-radius: 10px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .note {
    max-width: 560px;
    margin: 12px auto 0 auto;
    font-size: 13px;
    color: #8b93a5;
    line-height: 1.6;
    text-align: center;
  }
</style>
</head>
<body>
<a class="portal-link" href="../portal/">← 全サイト一覧へ</a>
<h1>📺 TV-6 深夜テレビ</h1>

<div class="tv">
  <div class="screen-wrap">
    <div class="screen" id="screenBox">
      <div class="ch-label" id="chLabel">CH-- 待機中</div>
      <div class="data-line" id="dataLine"></div>
      <div class="prog-text" id="progText">深夜テレビ TV-6へようこそ。
下のチャンネルボタンを押すと、AIが書いた番組が始まります。
音声で聞きたい時は「ボイス」をONにしてください。</div>
      <div class="status-line" id="statusLine"></div>
      <div class="detail-line" id="detailLine"></div>
    </div>
    <div class="noise" id="noiseFx"></div>
  </div>

  <div class="panel">
    <div class="cap">CHANNEL</div>
    <div class="ch-row">
      <button class="ch-btn" id="chBtn1" type="button">1</button>
      <button class="ch-btn" id="chBtn2" type="button">2</button>
      <button class="ch-btn" id="chBtn3" type="button">3</button>
      <button class="ch-btn" id="chBtn4" type="button">4</button>
      <button class="ch-btn" id="chBtn5" type="button">5</button>
    </div>
    <div class="sub-row">
      <button class="ctl-btn" id="voiceBtn" type="button">ボイス：OFF</button>
      <button class="ctl-btn" id="replayBtn" type="button">もう一度聞く</button>
    </div>
  </div>
</div>

<p class="note">1：AIニュース番組（本物の見出し＋AIの台本）／2：AI通販番組／3：AI時代劇／4：天気予報（本物の天気＋AIアナウンサー）／5：深夜のAI怪談<br>番組の文章はAIがその場で書いています。怪談は娯楽としてお楽しみください。</p>

<script>
var RSS2JSON = "https://api.rss2json.com/v1/api.json?rss_url=";
var NEWS_RSS = "https://news.google.com/rss/search?q=%22CUTIE%20STREET%22&hl=ja&gl=JP&ceid=JP:ja";
var WX_URL = "https://api.open-meteo.com/v1/forecast?latitude=35.8795&longitude=139.5197&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=Asia%2FTokyo";
var SAMPLE_HEADLINE = "（サンプル）人気アイドルグループ CUTIE STREET が新曲を発表、ファンから歓声";

var voiceOn = false;
var busy = false;
var curCh = 0;
var lastText = "";
var secTimer = null;
var secCount = 0;

function el(id) { return document.getElementById(id); }

function setStatus(t) { el("statusLine").textContent = t; }
function setDetail(t) { el("detailLine").textContent = t; }

function startSec() {
  secCount = 0;
  setStatus("受信中… 0秒");
  if (secTimer) { clearInterval(secTimer); }
  secTimer = setInterval(function () {
    secCount++;
    setStatus("受信中… " + secCount + "秒");
  }, 1000);
}
function stopSec() {
  if (secTimer) { clearInterval(secTimer); secTimer = null; }
}

/* ===== 砂嵐ノイズ ===== */
var noiseTimer = null;
function flickerNoise(ms) {
  var n = el("noiseFx");
  var frames = [
    "repeating-linear-gradient(0deg,#888 0 2px,#222 2px 4px,#ccc 4px 5px,#000 5px 8px)",
    "repeating-linear-gradient(0deg,#111 0 3px,#bbb 3px 4px,#333 4px 7px,#eee 7px 8px)",
    "repeating-linear-gradient(0deg,#ddd 0 1px,#000 1px 4px,#777 4px 6px,#444 6px 9px)",
    "repeating-linear-gradient(0deg,#222 0 2px,#eee 2px 3px,#555 3px 6px,#999 6px 7px)"
  ];
  var i = 0;
  n.className = "noise on";
  n.style.background = frames[0];
  if (noiseTimer) { clearInterval(noiseTimer); }
  noiseTimer = setInterval(function () {
    i = (i + 1) % frames.length;
    n.style.background = frames[i];
    n.style.opacity = (0.55 + Math.random() * 0.45) + "";
  }, 60);
  setTimeout(function () {
    if (noiseTimer) { clearInterval(noiseTimer); noiseTimer = null; }
    n.className = "noise";
  }, ms);
}

/* ===== 音声 ===== */
function speak(text) {
  if (!voiceOn) { return; }
  if (!text || text.length > 300) { return; }
  try {
    if (!("speechSynthesis" in window)) { return; }
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "ja-JP";
    u.pitch = 0.6;
    u.rate = 1.0;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

/* ===== AI通信 ===== */
function aiCall(prompt, onOk) {
  startSec();
  var xhr = new XMLHttpRequest();
  xhr.open("POST", "https://text.pollinations.ai/", true);
  xhr.setRequestHeader("Content-Type", "application/json");
  xhr.timeout = 90000;
  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4) { return; }
    stopSec();
    busy = false;
    var body = xhr.responseText || "";
    if (xhr.status === 402 || body.indexOf("Free limit") >= 0) {
      setStatus("");
      el("progText").textContent = "本日の無料AI回線は上限に達しました。明日の朝9時に回復します。";
      setDetail("");
      return;
    }
    if (xhr.status === 200 && body) {
      var t = body.replace(/^\s+|\s+$/g, "");
      if (t) {
        setStatus("");
        setDetail("");
        lastText = t;
        el("progText").textContent = t;
        if (onOk) { onOk(t); }
        speak(t);
        return;
      }
    }
    setStatus("");
    el("progText").textContent = "AI回線が混み合っています。少し待ってから、もう一度チャンネルを押してみてください。";
    setDetail("詳細：HTTP " + xhr.status);
  };
  xhr.ontimeout = function () {
    stopSec();
    busy = false;
    setStatus("");
    el("progText").textContent = "AIの返事が時間切れになりました（90秒）。もう一度チャンネルを押してみてください。";
    setDetail("");
  };
  xhr.onerror = function () {
    stopSec();
    busy = false;
    setStatus("");
    el("progText").textContent = "AI回線が混み合っています。少し待ってから、もう一度チャンネルを押してみてください。";
    setDetail("詳細：HTTP 0");
  };
  var payload = JSON.stringify({ messages: [{ role: "user", content: prompt }], model: "openai-fast" });
  xhr.send(payload);
}

/* ===== GET（フィード・天気） ===== */
function getJson(url, onOk, onNg) {
  var xhr = new XMLHttpRequest();
  xhr.open("GET", url, true);
  xhr.timeout = 20000;
  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4) { return; }
    if (xhr.status === 200) {
      try { onOk(JSON.parse(xhr.responseText)); return; } catch (e) {}
    }
    onNg();
  };
  xhr.onerror = function () { onNg(); };
  xhr.ontimeout = function () { onNg(); };
  xhr.send();
}

/* ===== チャンネル ===== */
var CH_NAMES = {
  1: "CH1 AIニュース番組",
  2: "CH2 AI通販番組",
  3: "CH3 AI時代劇",
  4: "CH4 天気予報",
  5: "CH5 深夜のAI怪談"
};

function markActive(n) {
  for (var i = 1; i <= 5; i++) {
    el("chBtn" + i).className = (i === n) ? "ch-btn active" : "ch-btn";
  }
}

function selectChannel(n) {
  if (busy) { return; }
  busy = true;
  curCh = n;
  markActive(n);
  flickerNoise(450);
  el("dataLine").style.display = "none";
  el("dataLine").textContent = "";
  setDetail("");
  setStatus("");
  try { if ("speechSynthesis" in window) { window.speechSynthesis.cancel(); } } catch (e) {}
  setTimeout(function () { startChannel(n); }, 480);
}

function startChannel(n) {
  var label = CH_NAMES[n];
  if (n === 1 || n === 2 || n === 3 || n === 5) {
    el("chLabel").innerHTML = "";
    el("chLabel").appendChild(document.createTextNode(label));
    var tag = document.createElement("span");
    tag.className = "ai-tag";
    tag.textContent = (n === 1) ? "AIが書いた番組です" : "AI番組";
    el("chLabel").appendChild(tag);
  } else {
    el("chLabel").textContent = label;
  }
  el("progText").textContent = "お待ちください…";
  if (n === 1) { chNews(); }
  else if (n === 2) { chShop(); }
  else if (n === 3) { chJidai(); }
  else if (n === 4) { chWeather(); }
  else if (n === 5) { chKaidan(); }
}

/* CH1 ニュース */
function chNews() {
  setStatus("見出しを受信中…");
  getJson(RSS2JSON + encodeURIComponent(NEWS_RSS), function (data) {
    var title = "";
    try {
      if (data && data.items && data.items.length > 0) { title = data.items[0].title || ""; }
    } catch (e) {}
    if (title) {
      el("dataLine").style.display = "block";
      el("dataLine").textContent = "📰 本日の見出し：" + title;
      newsScript(title);
    } else {
      newsFallback();
    }
  }, function () { newsFallback(); });
}
function newsFallback() {
  el("dataLine").style.display = "block";
  el("dataLine").textContent = "📰 " + SAMPLE_HEADLINE + "（見出しの取得に失敗したためサンプルです）";
  newsScript(SAMPLE_HEADLINE);
}
function newsScript(title) {
  var p = "あなたは深夜のニュース番組のアナウンサーです。次の見出しをもとに、テレビニュース風の短い原稿を書いてください。マークダウンは使わず普通の文章で、220文字以内。分からない詳細は勝手に作らず、見出しの範囲で伝えてください。見出し：「" + title + "」";
  aiCall(p, null);
}

/* CH2 通販 */
function chShop() {
  var p = "あなたは深夜の通販番組の司会者です。実在しない面白い架空の商品を1つ考えて、商品名・価格・熱のこもった売り文句で紹介してください。マークダウンは使わず普通の文章で、220文字以内。実在の商品や本当の効果があるかのような断定はしないでください。";
  aiCall(p, null);
}

/* CH3 時代劇 */
function chJidai() {
  var p = "あなたは時代劇の語り部です。江戸時代を舞台にした短い時代劇のあらすじを、登場人物と見せ場が分かるように書いてください。マークダウンは使わず普通の文章で、220文字以内。";
  aiCall(p, null);
}

/* CH4 天気 */
var WX_TXT = {
  0: "快晴", 1: "晴れ", 2: "晴れ時々くもり", 3: "くもり",
  45: "霧", 48: "霧",
  51: "小雨", 53: "小雨", 55: "小雨",
  61: "雨", 63: "雨", 65: "強い雨",
  66: "雨", 67: "雨",
  71: "雪", 73: "雪", 75: "大雪", 77: "雪",
  80: "にわか雨", 81: "にわか雨", 82: "激しいにわか雨",
  85: "雪", 86: "雪",
  95: "雷雨", 96: "雷雨", 99: "雷雨"
};
function chWeather() {
  setStatus("天気を受信中…");
  getJson(WX_URL, function (data) {
    var maxT = null, minT = null, code = null;
    try {
      maxT = data.daily.temperature_2m_max[0];
      minT = data.daily.temperature_2m_min[0];
      code = data.daily.weather_code[0];
    } catch (e) {}
    if (maxT === null || minT === null) { wxFail(); return; }
    var cond = WX_TXT[code] || "くもり";
    el("dataLine").style.display = "block";
    el("dataLine").textContent = "🌤 ふじみ野市 今日の天気（本物のデータ）： " + cond + "　最高 " + Math.round(maxT) + "℃ ／ 最低 " + Math.round(minT) + "℃";
    var p = "あなたは天気予報のアナウンサーです。埼玉県ふじみ野市の今日の天気は「" + cond + "」、最高気温" + Math.round(maxT) + "度、最低気温" + Math.round(minT) + "度です。この数字を使って、明るく元気な天気予報の原稿を書いてください。マークダウンは使わず普通の文章で、180文字以内。数字は変えないでください。";
    aiCall(p, null);
  }, function () { wxFail(); });
}
function wxFail() {
  busy = false;
  setStatus("");
  el("progText").textContent = "天気の取得に失敗しました。ネットの状態を確認して、もう一度4ボタンを押してみてください。";
}

/* CH5 怪談 */
function chKaidan() {
  var p = "あなたは深夜番組の怪談師です。短くて少しぞっとする怪談を語ってください。これは娯楽の創作です。マークダウンは使わず普通の文章で、250文字以内。残酷すぎる表現は避けてください。";
  aiCall(p, null);
}

/* ===== ボタン ===== */
function bind() {
  var i;
  for (i = 1; i <= 5; i++) {
    (function (n) {
      el("chBtn" + n).onclick = function () { selectChannel(n); };
    })(i);
  }
  el("voiceBtn").onclick = function () {
    voiceOn = !voiceOn;
    el("voiceBtn").textContent = voiceOn ? "ボイス：ON" : "ボイス：OFF";
    if (!voiceOn) {
      try { if ("speechSynthesis" in window) { window.speechSynthesis.cancel(); } } catch (e) {}
    }
  };
  el("replayBtn").onclick = function () {
    if (lastText) {
      var was = voiceOn;
      voiceOn = true;
      speak(lastText);
      voiceOn = was;
    }
  };
}
bind();
</script>
</body>
</html>
