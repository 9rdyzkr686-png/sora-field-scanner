<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>JIHANKI-6 深夜の自動販売機</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { background:#050914; }
  body {
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans",sans-serif;
    color:#dfe8ff; min-height:100vh; padding:10px 10px 26px;
    background:
      radial-gradient(ellipse 90px 34px at 82% 34px, rgba(240,244,200,.85), rgba(240,244,200,0) 70%),
      radial-gradient(ellipse 300px 120px at 50% 108%, rgba(38,64,140,.5), rgba(38,64,140,0) 70%),
      linear-gradient(#04060f 0%, #071022 55%, #0a1428 100%);
  }
  .stars { color:#8fa8d8; font-size:10px; letter-spacing:6px; text-align:center; opacity:.7; padding:2px 0 0; }
  .topbar { overflow:hidden; margin:4px 0 8px; }
  .portal-link {
    float:left; display:block; min-height:48px; line-height:48px; padding:0 14px;
    color:#9fd8ff; text-decoration:none; font-size:15px;
    border:2px solid #2c4a7c; border-radius:10px; background:rgba(10,22,48,.85);
  }
  #voiceBtn {
    float:right; min-height:48px; min-width:118px; padding:0 12px;
    font-size:15px; font-weight:bold; color:#ffe9a8; cursor:pointer;
    border:2px solid #7c642c; border-radius:10px; background:rgba(48,38,10,.9);
  }
  h1 {
    text-align:center; font-size:21px; letter-spacing:2px; color:#fff;
    text-shadow:0 0 8px #6fc3ff, 0 0 22px #2f7fe0; margin:2px 0 2px;
  }
  .sub { text-align:center; font-size:13px; color:#9db4dd; margin-bottom:10px; }

  /* ===== 自動販売機 ===== */
  .machine {
    max-width:430px; margin:0 auto; border-radius:16px; padding:12px 12px 14px;
    background:linear-gradient(#8e1620, #6d0f18 60%, #570b12);
    border:3px solid #2b0206;
    box-shadow:0 0 34px rgba(255,70,80,.28), 0 0 90px rgba(90,150,255,.16), inset 0 2px 0 rgba(255,255,255,.25);
  }
  .window {
    border-radius:10px; padding:12px 10px 10px; text-align:center;
    background:linear-gradient(#fdf6d8, #ffeeb0);
    border:3px solid #20140a;
    box-shadow:inset 0 0 22px rgba(255,196,0,.55), 0 0 18px rgba(255,238,170,.75);
    color:#33240a;
  }
  .window .w-title { font-size:19px; font-weight:bold; letter-spacing:3px; }
  .window .w-sub { font-size:12px; margin-top:3px; color:#6b5320; }
  .cans { font-size:19px; letter-spacing:5px; margin-top:6px; }
  .free-note {
    text-align:center; margin:10px 0 2px; font-size:15px; font-weight:bold; color:#ffe9a8;
    text-shadow:0 0 8px rgba(255,200,60,.6);
  }
  .btns { margin-top:8px; }
  .drink-btn {
    display:block; width:100%; min-height:56px; margin:9px 0; padding:8px 12px;
    font-size:17px; font-weight:bold; color:#101018; text-align:left; cursor:pointer;
    border-radius:12px; border:3px solid rgba(0,0,0,.45);
    box-shadow:0 4px 0 rgba(0,0,0,.5), inset 0 2px 0 rgba(255,255,255,.55);
  }
  .drink-btn:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.5); }
  .drink-btn .price { float:right; font-size:13px; font-weight:normal; opacity:.75; }
  .b0 { background:linear-gradient(#ffb37a, #ff8a3c); }
  .b1 { background:linear-gradient(#b7f0c0, #5fd06e); }
  .b2 { background:linear-gradient(#aee2ff, #4fa8e8); }
  .b3 { background:linear-gradient(#ffd7f2, #f07fc4); }
  .b4 { background:linear-gradient(#fff3a6, #ffd83c); }
  .b5 { background:linear-gradient(#e6ccff, #a678e8); }
  .drink-btn.busy { opacity:.55; }
  .drink-btn.soldout { opacity:.48; }
  .clerk-btn {
    display:block; width:100%; min-height:48px; margin:10px 0 2px; padding:8px 12px;
    font-size:15px; font-weight:bold; color:#ffe9a8; cursor:pointer;
    border-radius:12px; border:3px solid #7c642c; background:rgba(48,38,10,.85);
    box-shadow:0 4px 0 rgba(0,0,0,.5);
  }
  .clerk-btn:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.5); }
  .clerk-btn.busy { opacity:.55; }
  .usual-btn {
    display:block; width:100%; min-height:52px; margin:10px 0 2px; padding:8px 12px;
    font-size:16px; font-weight:bold; color:#d8ffe2; cursor:pointer;
    border-radius:12px; border:3px solid #2c7c4a; background:rgba(10,48,26,.9);
    box-shadow:0 4px 0 rgba(0,0,0,.5);
  }
  .usual-btn:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.5); }
  .usual-btn.off { opacity:.5; }

  /* ===== 両替機コーナー ===== */
  .exchange {
    max-width:430px; margin:14px auto 0; border-radius:14px; padding:12px;
    background:rgba(10,22,48,.85); border:2px solid #2c4a7c;
  }
  .ex-title { font-size:16px; font-weight:bold; color:#9fd8ff; margin-bottom:8px; }
  .ex-row { overflow:hidden; }
  #chgInput {
    float:left; width:58%; min-height:48px; font-size:17px; padding:8px 10px;
    border-radius:10px; border:2px solid #2c4a7c; background:#0a1428; color:#fff;
  }
  #chgBtn {
    float:right; width:38%; min-height:48px; font-size:16px; font-weight:bold; cursor:pointer;
    border-radius:10px; border:2px solid #2c4a7c; background:#173a6e; color:#dfe8ff;
  }
  #chgResult { margin-top:10px; font-size:16px; line-height:1.7; color:#f2f6ff; white-space:pre-wrap; word-break:break-word; }

  /* ===== 購入履歴 ===== */
  #histSummary { font-size:16px; line-height:1.7; color:#ffe9a8; margin-bottom:6px; }
  .hist-row { font-size:15px; line-height:1.55; padding:6px 0; border-bottom:1px solid rgba(44,74,124,.5); word-break:break-word; }
  .hist-row:last-child { border-bottom:none; }
  .hist-date { color:#8fa8d8; font-size:13px; }
  #histClearBtn {
    display:block; width:100%; min-height:48px; margin-top:10px; padding:8px 12px;
    font-size:15px; font-weight:bold; color:#dfe8ff; cursor:pointer;
    border-radius:10px; border:2px solid #2c4a7c; background:#173a6e;
  }
  #histClearBtn:active { transform:translateY(2px); }

  /* ===== 取り出し口 ===== */
  .slot {
    margin-top:12px; border-radius:10px; padding:12px;
    background:linear-gradient(#0a0d16, #141a28);
    border:3px solid #000; box-shadow:inset 0 6px 14px rgba(0,0,0,.9), inset 0 -2px 0 rgba(255,255,255,.08);
    min-height:120px;
  }
  .slot-label { font-size:12px; color:#7d8fb3; letter-spacing:2px; margin-bottom:6px; }
  #slotText { font-size:17px; line-height:1.65; color:#f2f6ff; white-space:pre-wrap; word-break:break-word; }
  #slotText.waiting { color:#ffd76e; }
  #slotText.error { color:#ff9d9d; }
  .detail { display:block; margin-top:6px; font-size:12px; color:#8d99b5; }
  .drop { animation:dropIn .45s ease-out; -webkit-animation:dropIn .45s ease-out; }
  @keyframes dropIn {
    0% { transform:translateY(-34px); opacity:0; }
    60% { transform:translateY(4px); opacity:1; }
    100% { transform:translateY(0); opacity:1; }
  }
  @-webkit-keyframes dropIn {
    0% { -webkit-transform:translateY(-34px); opacity:0; }
    60% { -webkit-transform:translateY(4px); opacity:1; }
    100% { -webkit-transform:translateY(0); opacity:1; }
  }
  .counter { text-align:center; margin-top:12px; font-size:15px; color:#cfe0ff; }
  .counter span { color:#ffd76e; font-weight:bold; font-size:18px; }
  .foot { text-align:center; margin-top:14px; font-size:12px; color:#5f7195; line-height:1.7; }
</style>
</head>
<body>
  <div class="stars">・　・　・　・　・　・</div>
  <div class="topbar">
    <a class="portal-link" href="../portal/">← 全サイト一覧へ</a>
    <button id="voiceBtn" type="button">ボイス：ON</button>
  </div>
  <h1>JIHANKI-6</h1>
  <div class="sub">〜 深夜の自動販売機 〜</div>

  <div class="machine">
    <div class="window">
      <div class="w-title">よるの じはんき</div>
      <div class="w-sub">真夜中だけ開いている、ふしぎな自販機</div>
      <div class="cans">🥫🧃🥤🧋🍵</div>
    </div>

    <div class="free-note">★ 全部無料・コインいりません ★</div>

    <div class="btns">
      <button class="drink-btn b0" id="b0" type="button">📕 あたたかい短編<span class="price">むりょう</span></button>
      <button class="drink-btn b1" id="b1" type="button">🎋 AI俳句<span class="price">むりょう</span></button>
      <button class="drink-btn b2" id="b2" type="button">💡 AI一言アドバイス<span class="price">むりょう</span></button>
      <button class="drink-btn b3" id="b3" type="button">🔮 AI占い<span class="price">むりょう</span></button>
      <button class="drink-btn b4" id="b4" type="button">🐶 ダックス便り<span class="price">むりょう</span></button>
      <button class="drink-btn b5" id="b5" type="button">🍁 季節限定<span class="price">むりょう</span></button>
      <button class="usual-btn off" id="usualBtn" type="button">いつもの（まだ履歴がありません）</button>
      <button class="clerk-btn" id="clerkBtn" type="button">🛎 店員さんを呼ぶ（売り切れのとき）</button>
    </div>

    <div class="slot">
      <div class="slot-label">▼ とりだしぐち ▼</div>
      <div id="slotText">ボタンを押すと、ここにポトンと落ちてきます。</div>
    </div>
  </div>

  <div class="exchange">
    <div class="ex-title">💱 両替機コーナー</div>
    <div class="ex-row">
      <input id="chgInput" type="number" inputmode="numeric" placeholder="金額（円）" min="1">
      <button id="chgBtn" type="button">両替する</button>
    </div>
    <div id="chgResult">金額を入れて「両替する」を押すと、お札と小銭に分けて数えます。</div>
  </div>

  <div class="counter">出てきた数：<span id="countNum">0</span> 個</div>

  <div class="exchange">
    <div class="ex-title">🧾 購入履歴</div>
    <div id="histSummary">まだ何も出ていません。</div>
    <div id="histList"></div>
    <button id="histClearBtn" type="button">履歴を消す</button>
  </div>
  <div class="foot">中身はAIがその場で作っています。同じボタンでも毎回ちがいます。<br>無料AI回線には1日の上限があります。</div>

<script>
var ITEMS = [
  { prompt: "心があたたかくなる、とても短い物語を書いてください。200文字以内の日本語、本文だけを書いてください。マークダウンや記号の装飾は使わないでください。" },
  { prompt: "俳句を一句作ってください。そのあと改行して、一行で短い解説を添えてください。日本語で、マークダウンは使わないでください。" },
  { prompt: "今日を少し良くするための一言アドバイスを、日本語で一文だけください。やさしく具体的に。マークダウンは使わないでください。" },
  { prompt: "今日の小さな占いをしてください。運勢のランク（大吉・中吉・小吉・吉・末吉のどれか）と、ラッキーアイテムを、日本語で2行以内にまとめてください。マークダウンは使わないでください。" },
  { prompt: "カニンヘンダックスフンドの視点で、人間の小野さんへの短いお便りを書いてください。かわいく、150文字以内の日本語で、本文だけを書いてください。マークダウンは使わないでください。" },
  { prompt: "" }
];

var NAMES = ['あたたかい短編', 'AI俳句', 'AI一言アドバイス', 'AI占い', 'ダックス便り', '季節限定'];
var BTN_ORIG = [];
var soldOutIdx = -1;
var restocked = false;

var busy = false;
var count = 0;
var voiceOn = true;
var timerId = null;
var audioCtx = null;

function el(id) { return document.getElementById(id); }

function setSlot(text, cls) {
  var s = el('slotText');
  s.className = cls || '';
  s.innerHTML = '';
  s.appendChild(document.createTextNode(text));
}

function dropAnimate() {
  var s = el('slotText');
  s.classList.remove('drop');
  void s.offsetWidth;
  s.classList.add('drop');
}

function speak(text) {
  if (!voiceOn) { return; }
  if (!('speechSynthesis' in window)) { return; }
  if (text.indexOf('\n') !== -1) { return; }
  if (text.length > 150) { return; }
  try {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    u.pitch = 0.6;
    u.rate = 1.0;
    speechSynthesis.speak(u);
  } catch (e) {}
}

function clunk() {
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { return; }
    if (!audioCtx) { audioCtx = new AC(); }
    if (audioCtx.state === 'suspended') { audioCtx.resume(); }
    var t = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(140, t);
    osc.frequency.exponentialRampToValueAtTime(45, t + 0.13);
    gain.gain.setValueAtTime(0.22, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.18);
  } catch (e) {}
}

function stopTimer() {
  if (timerId !== null) { clearInterval(timerId); timerId = null; }
}

function finish(btn) {
  busy = false;
  stopTimer();
  if (btn) {
    btn.classList.remove('busy');
    if (btn.getAttribute('data-label')) { btn.innerHTML = btn.getAttribute('data-label'); }
  }
}

function showError(btn, msg, detail) {
  finish(btn);
  var s = el('slotText');
  s.className = 'error';
  s.innerHTML = '';
  s.appendChild(document.createTextNode(msg));
  if (detail) {
    var d = document.createElement('span');
    d.className = 'detail';
    d.appendChild(document.createTextNode(detail));
    s.appendChild(d);
  }
}

/* AI回線v2：1回目30秒、時間切れ/HTTP 0/5xxなら45秒でもう一度だけ再試行。402・上限は即エラー */
function sendAI(prompt, onRetry, okFn, errFn) {
  var payload = JSON.stringify({
    messages: [{ role: 'user', content: prompt }],
    model: 'openai-fast'
  });
  var attempt = 0;
  function send() {
    attempt++;
    var settled = false;
    var xhr = new XMLHttpRequest();
    xhr.open('POST', 'https://text.pollinations.ai/', true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.timeout = (attempt === 1) ? 30000 : 45000;
    function fail(msg, detail) {
      if (settled) { return; }
      settled = true;
      errFn(msg, detail);
    }
    function retryOr(msg, detail) {
      if (settled) { return; }
      if (attempt === 1) {
        settled = true;
        if (onRetry) { onRetry(); }
        send();
        return;
      }
      fail(msg, detail);
    }
    xhr.onload = function() {
      if (settled) { return; }
      var body = xhr.responseText || '';
      if (xhr.status === 402 || body.indexOf('Free limit') !== -1) {
        fail('本日の無料AI回線は上限に達しました。明日の朝9時に回復します', '');
        return;
      }
      if (xhr.status >= 500 && xhr.status <= 599) {
        retryOr('AI回線が混み合っています', '詳細：HTTP ' + xhr.status);
        return;
      }
      if (xhr.status !== 200) {
        fail('AI回線が混み合っています', '詳細：HTTP ' + xhr.status);
        return;
      }
      var text = body.replace(/^\s+|\s+$/g, '');
      if (!text) {
        fail('AI回線が混み合っています', '詳細：HTTP 200（空の返事）');
        return;
      }
      if (text.length > 500) { text = text.substring(0, 500); }
      settled = true;
      okFn(text);
    };
    xhr.onerror = function() {
      retryOr('AI回線が混み合っています', '詳細：HTTP 0');
    };
    xhr.ontimeout = function() {
      retryOr('AIの返事が時間切れになりました（75秒）。もう一度押してみてください', '');
    };
    xhr.send(payload);
  }
  send();
}

function dispense(idx) {
  if (busy) { return; }
  busy = true;
  var btn = el('b' + idx);
  if (!btn.getAttribute('data-label')) { btn.setAttribute('data-label', btn.innerHTML); }
  btn.classList.add('busy');
  btn.innerHTML = '…';

  var sec = 0;
  var retrying = false;
  setSlot('ガシャン… 0秒', 'waiting');
  stopTimer();
  timerId = setInterval(function() {
    sec++;
    setSlot('ガシャン… ' + sec + '秒' + (retrying ? '（再試行中）' : ''), 'waiting');
  }, 1000);

  sendAI(ITEMS[idx].prompt, function() { retrying = true; }, function(text) {
    finish(btn);
    setSlot(text, '');
    dropAnimate();
    clunk();
    count++;
    el('countNum').innerHTML = String(count);
    recordHistory(NAMES[idx]);
    speak(text);
  }, function(msg, detail) {
    showError(btn, msg, detail);
  });
}

function seasonInfo() {
  var m = new Date().getMonth() + 1;
  if (m >= 3 && m <= 5) { return { name: '春', emoji: '🌸', theme: '桜と新年度' }; }
  if (m >= 6 && m <= 8) { return { name: '夏', emoji: '🌻', theme: '暑さと海' }; }
  if (m >= 9 && m <= 11) { return { name: '秋', emoji: '🍁', theme: '紅葉と食欲' }; }
  return { name: '冬', emoji: '⛄', theme: '寒さと温かいもの' };
}

function soldOutTap() {
  if (busy) { return; }
  clunk();
  var msg = '売り切れでした… ごめんなさい。店員さんを呼ぶと、補充してもらえるかもしれません。';
  setSlot(msg, '');
  speak(msg);
}

function restock() {
  restocked = true;
  var btn = el('b' + soldOutIdx);
  btn.classList.remove('soldout');
  btn.innerHTML = BTN_ORIG[soldOutIdx];
}

function callClerk() {
  if (busy) { return; }
  if (restocked) {
    clunk();
    setSlot('店員さん「もう補充ずみですよ〜。また明日お越しください」', '');
    return;
  }
  busy = true;
  var btn = el('clerkBtn');
  if (!btn.getAttribute('data-label')) { btn.setAttribute('data-label', btn.innerHTML); }
  btn.classList.add('busy');
  btn.innerHTML = '…';

  var sec = 0;
  var retrying = false;
  setSlot('店員さんを呼んでいます… 0秒', 'waiting');
  stopTimer();
  timerId = setInterval(function() {
    sec++;
    setSlot('店員さんを呼んでいます… ' + sec + '秒' + (retrying ? '（再試行中）' : ''), 'waiting');
  }, 1000);

  sendAI('あなたは深夜の自動販売機の店員さんです。売り切れで買えなかったお客さんに、やさしくおわびして、この自販機の別のおすすめ（あたたかい短編・俳句・一言アドバイス・占い・ダックス便りのどれか）をすすめてください。日本語で120文字以内、本文だけを書いてください。マークダウンは使わないでください。', function() { retrying = true; }, function(text) {
    finish(btn);
    restock();
    setSlot(text + '\n（店員さんが「' + NAMES[soldOutIdx] + '」を補充してくれました！）', '');
    dropAnimate();
    clunk();
    speak(text);
  }, function(msg, detail) {
    showError(btn, msg, detail);
  });
}

function doExchange() {
  var amt = parseInt(el('chgInput').value, 10);
  var out = el('chgResult');
  out.innerHTML = '';
  if (isNaN(amt) || amt < 1) {
    out.appendChild(document.createTextNode('金額を入れてください（1円以上）。'));
    return;
  }
  if (amt > 99999999) {
    out.appendChild(document.createTextNode('大きすぎます。99,999,999円までにしてください。'));
    return;
  }
  var denoms = [
    [10000, '一万円札'], [5000, '五千円札'], [1000, '千円札'],
    [500, '五百円玉'], [100, '百円玉'], [50, '五十円玉'],
    [10, '十円玉'], [5, '五円玉'], [1, '一円玉']
  ];
  var rest = amt;
  var total = 0;
  var lines = [];
  var i, n;
  for (i = 0; i < denoms.length; i++) {
    n = Math.floor(rest / denoms[i][0]);
    if (n > 0) {
      lines.push(denoms[i][1] + ' × ' + n + '枚');
      total += n;
      rest -= n * denoms[i][0];
    }
  }
  var jokes = [
    'ガシャン！両替できました。',
    '両替完了！…でもこの自販機、全部無料でした。',
    '小銭のジャラジャラ感、いいですよね。'
  ];
  var text = amt + '円 → 合計 ' + total + '枚\n' + lines.join('\n') + '\n' + jokes[amt % jokes.length];
  out.appendChild(document.createTextNode(text));
  clunk();
}

/* (261) 購入履歴 */
var HIST_KEY = 'jihanki6_history_v1';
var HIST_MAX = 100;
function histPad(x) { return (x < 10 ? '0' : '') + x; }
function histNowStr() {
  var n = new Date();
  return n.getFullYear() + '/' + histPad(n.getMonth() + 1) + '/' + histPad(n.getDate()) + ' ' + histPad(n.getHours()) + ':' + histPad(n.getMinutes());
}
function loadHistory() {
  try {
    var s = localStorage.getItem(HIST_KEY);
    if (s) { var a = JSON.parse(s); if (a && typeof a.length === 'number') { return a; } }
  } catch (e) {}
  return [];
}
function storeHistory(a) {
  try { localStorage.setItem(HIST_KEY, JSON.stringify(a)); } catch (e) {}
}
function recordHistory(name) {
  var a = loadHistory();
  a.unshift({ name: name, date: histNowStr() });
  while (a.length > HIST_MAX) { a.pop(); }
  storeHistory(a);
  renderHistory();
}
function renderHistory() {
  var sum = el('histSummary'), list = el('histList');
  if (!sum || !list) { return; }
  var a = loadHistory(), i;
  list.innerHTML = '';
  sum.innerHTML = '';
  if (a.length === 0) {
    sum.appendChild(document.createTextNode('まだ何も出ていません。'));
    updateUsualBtn();
    return;
  }
  var now = new Date();
  var ym = now.getFullYear() + '/' + histPad(now.getMonth() + 1);
  var monthCount = 0, counts = {}, bestName = '', bestCount = 0;
  for (i = 0; i < a.length; i++) {
    if (a[i].date && a[i].date.indexOf(ym) === 0) { monthCount++; }
    counts[a[i].name] = (counts[a[i].name] || 0) + 1;
    if (counts[a[i].name] > bestCount) { bestCount = counts[a[i].name]; bestName = a[i].name; }
  }
  sum.appendChild(document.createTextNode('通算' + a.length + '本・今月' + monthCount + '本'));
  sum.appendChild(document.createElement('br'));
  sum.appendChild(document.createTextNode('一番人気：' + bestName + '（' + bestCount + '回）'));
  var show = Math.min(20, a.length);
  for (i = 0; i < show; i++) {
    var row = document.createElement('div');
    row.className = 'hist-row';
    var d = document.createElement('span');
    d.className = 'hist-date';
    d.appendChild(document.createTextNode(a[i].date));
    row.appendChild(d);
    row.appendChild(document.createElement('br'));
    row.appendChild(document.createTextNode(a[i].name));
    list.appendChild(row);
  }
  updateUsualBtn();
}
function clearHistory() {
  storeHistory([]);
  renderHistory();
}

/* (326) いつものボタン */
function mostBoughtName() {
  var a = loadHistory();
  var counts = {}, bestName = '', bestCount = 0, i;
  for (i = 0; i < a.length; i++) {
    counts[a[i].name] = (counts[a[i].name] || 0) + 1;
    if (counts[a[i].name] > bestCount) { bestCount = counts[a[i].name]; bestName = a[i].name; }
  }
  return bestName;
}
function updateUsualBtn() {
  var btn = el('usualBtn');
  if (!btn) { return; }
  var name = mostBoughtName();
  btn.innerHTML = '';
  if (!name) {
    btn.appendChild(document.createTextNode('いつもの（まだ履歴がありません）'));
    btn.disabled = true;
    btn.classList.add('off');
    return;
  }
  btn.appendChild(document.createTextNode('⭐ いつもの（' + name + '）'));
  btn.disabled = false;
  btn.classList.remove('off');
}
function dispenseUsual() {
  var name = mostBoughtName();
  if (!name) { return; }
  var idx = -1, i;
  for (i = 0; i < NAMES.length; i++) {
    if (NAMES[i] === name) { idx = i; break; }
  }
  if (idx < 0) { return; }
  if (idx === soldOutIdx && !restocked) { soldOutTap(); }
  else { dispense(idx); }
}

function init() {
  var i;
  var now = new Date();
  renderHistory();
  el('histClearBtn').addEventListener('click', clearHistory, false);

  /* 季節限定ボタン：季節でラベルとプロンプトを変える */
  var s = seasonInfo();
  ITEMS[5].prompt = '今は' + (now.getMonth() + 1) + '月、' + s.name + 'の季節です。' + s.theme + 'をテーマに、心があたたかくなる、とても短い物語を書いてください。200文字以内の日本語、本文だけを書いてください。マークダウンや記号の装飾は使わないでください。';
  el('b5').innerHTML = s.emoji + ' 季節限定（' + s.name + '）<span class="price">むりょう</span>';

  /* 本日の売り切れ：日付シードで通常ボタン5つのうち1つ */
  var seed = now.getFullYear() * 10000 + (now.getMonth() + 1) * 100 + now.getDate();
  soldOutIdx = seed % 5;
  for (i = 0; i < 5; i++) { BTN_ORIG[i] = el('b' + i).innerHTML; }
  var soBtn = el('b' + soldOutIdx);
  soBtn.classList.add('soldout');
  soBtn.innerHTML = BTN_ORIG[soldOutIdx].replace('<span', '（売り切れ）<span');

  for (i = 0; i < ITEMS.length; i++) {
    (function(n) {
      el('b' + n).addEventListener('click', function() {
        if (n === soldOutIdx && !restocked) { soldOutTap(); }
        else { dispense(n); }
      }, false);
    })(i);
  }
  el('usualBtn').addEventListener('click', dispenseUsual, false);
  el('clerkBtn').addEventListener('click', callClerk, false);
  el('chgBtn').addEventListener('click', doExchange, false);
  el('voiceBtn').addEventListener('click', function() {
    voiceOn = !voiceOn;
    el('voiceBtn').innerHTML = voiceOn ? 'ボイス：ON' : 'ボイス：OFF';
    if (!voiceOn && ('speechSynthesis' in window)) {
      try { speechSynthesis.cancel(); } catch (e) {}
    }
  }, false);
}

init();
</script>
