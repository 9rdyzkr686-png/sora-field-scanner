<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>JIKAN-6 時間旅行券売機</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #f3ead2;
    color: #1d2a4a;
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
    font-size: 17px;
    line-height: 1.5;
    padding: 12px 12px 28px;
  }
  header {
    text-align: center;
    border: 3px double #1d2a4a;
    background: #faf3dd;
    padding: 12px 8px 10px;
    margin-bottom: 12px;
  }
  header .sub { font-size: 13px; letter-spacing: 4px; color: #8a2b23; font-weight: bold; }
  h1 { margin: 2px 0 4px; font-size: 26px; letter-spacing: 2px; color: #1d2a4a; }
  header .note { font-size: 13px; color: #5a5342; }
  .osusume {
    background: #fdf8e7;
    border: 2px solid #8a2b23;
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 14px;
    position: relative;
  }
  .osusume .label { font-size: 13px; font-weight: bold; color: #8a2b23; letter-spacing: 2px; }
  .osusume .era { font-size: 22px; font-weight: bold; color: #1d2a4a; }
  .osusume .why { font-size: 14px; color: #5a5342; }
  h2 {
    font-size: 16px; letter-spacing: 2px; color: #1d2a4a;
    border-left: 6px solid #8a2b23; padding-left: 8px; margin: 16px 0 8px;
  }
  .eraGrid { overflow: hidden; }
  .eraBtn {
    float: left; width: 32%; margin: 0 2% 10px 0;
    min-height: 56px; padding: 10px 2px;
    font-size: 17px; font-weight: bold; color: #1d2a4a;
    background: #fdf8e7; border: 2px solid #1d2a4a; border-radius: 6px;
    cursor: pointer;
  }
  .eraBtn:nth-child(3n) { margin-right: 0; }
  .eraBtn.selected { background: #1d2a4a; color: #f3ead2; }
  .ticketWrap { margin-top: 4px; }
  .placeholder {
    border: 2px dashed #a5977a; border-radius: 6px; padding: 18px 12px;
    text-align: center; color: #8a8064; background: #efe6cd; font-size: 16px;
  }
  .ticket {
    background: #fffdf4;
    border: 2px solid #1d2a4a;
    border-radius: 8px;
    padding: 14px 14px 12px;
    position: relative;
    overflow: hidden;
  }
  .ticket:before, .ticket:after {
    content: ""; position: absolute; top: 50%; width: 22px; height: 22px;
    background: #f3ead2; border: 2px solid #1d2a4a; border-radius: 50%;
    margin-top: -11px;
  }
  .ticket:before { left: -13px; }
  .ticket:after { right: -13px; }
  .ticket .route { font-size: 20px; font-weight: bold; text-align: center; color: #1d2a4a; }
  .ticket .route .arrow { color: #8a2b23; }
  .ticket .rows { margin-top: 10px; border-top: 1px dashed #a5977a; padding-top: 8px; }
  .ticket .row { font-size: 16px; margin: 3px 0; }
  .ticket .row .k { color: #5a5342; font-size: 14px; }
  .stamp {
    position: absolute; top: 10px; right: 12px;
    width: 62px; height: 62px; border: 3px solid #b3372c; border-radius: 50%;
    color: #b3372c; font-weight: bold; font-size: 13px; line-height: 1.25;
    text-align: center; padding-top: 12px;
    -webkit-transform: rotate(12deg); transform: rotate(12deg);
    opacity: 0.85; background: rgba(255,253,244,0.6);
  }
  .triviaBox {
    background: #fdf8e7; border: 2px solid #1d2a4a; border-radius: 6px;
    padding: 12px; margin-top: 12px; min-height: 86px;
  }
  .triviaBox .tlabel { font-size: 13px; font-weight: bold; color: #8a2b23; letter-spacing: 2px; }
  .triviaBox .ttext { font-size: 18px; margin-top: 4px; }
  .bigBtn {
    display: block; width: 100%; min-height: 54px; margin-top: 10px;
    font-size: 19px; font-weight: bold; border-radius: 6px; cursor: pointer;
    border: 2px solid #1d2a4a;
  }
  .nextBtn { background: #fdf8e7; color: #1d2a4a; }
  .goBtn { background: #8a2b23; color: #fff8ea; border-color: #8a2b23; font-size: 22px; letter-spacing: 4px; }
  .goBtn:disabled { background: #b9a894; border-color: #b9a894; }
  .zukanBox {
    background: #fdf8e7; border: 2px solid #1d2a4a; border-radius: 6px;
    padding: 12px; margin-top: 12px;
  }
  .zukanHead { font-size: 20px; font-weight: bold; color: #8a2b23; }
  .zukanCeleb {
    margin-top: 6px; padding: 8px 10px; border-radius: 6px;
    background: #8a2b23; color: #fff8ea; font-weight: bold; font-size: 17px;
    text-align: center;
  }
  .zukanList { list-style: none; margin: 10px 0 0; padding: 0; }
  .zukanList li {
    padding: 8px 4px; border-bottom: 1px dashed #a5977a; font-size: 17px;
    overflow: hidden;
  }
  .zukanList li:last-child { border-bottom: none; }
  .zukanList .zname { font-weight: bold; }
  .zukanList .zcount { float: right; color: #8a2b23; font-weight: bold; }
  .zukanList .zcount.none { color: #8a8064; font-weight: normal; }
  .log {
    margin-top: 12px; background: #1d2a4a; color: #f3ead2; border-radius: 6px;
    padding: 12px 14px; min-height: 60px; font-size: 17px; display: none;
  }
  .log div { margin: 4px 0; }
  .log .arrive { color: #ffd98a; font-weight: bold; }
  footer { margin-top: 22px; text-align: center; }
  .portalBtn {
    display: block; min-height: 52px; line-height: 52px;
    background: #1d2a4a; color: #f3ead2; text-decoration: none;
    font-size: 18px; font-weight: bold; border-radius: 6px; letter-spacing: 2px;
  }
  .credit { margin-top: 10px; font-size: 12px; color: #8a8064; }
</style>
</head>
<body>

<header>
  <div class="sub">TIME TRAVEL TICKETS</div>
  <h1>JIKAN-6 時間旅行券売機</h1>
  <div class="note">時代を選ぶと切符が発行されます。往復の保証はありません。</div>
</header>

<div class="osusume">
  <div class="label">★ 本日のおすすめの時代</div>
  <div class="era" id="osusumeEra">読み込み中…</div>
  <div class="why" id="osusumeWhy"></div>
</div>

<h2>行き先を選んでください</h2>
<div class="eraGrid" id="eraGrid"></div>

<h2>あなたの切符</h2>
<div class="ticketWrap">
  <div class="placeholder" id="ticketPlaceholder">まだ切符がありません。<br>上のボタンから時代を選んでください。</div>
  <div class="ticket" id="ticket" style="display:none;">
    <div class="stamp" id="ticketStamp">JIKAN-6</div>
    <div class="route">現在 <span class="arrow">→</span> <span id="ticketDest">―</span></div>
    <div class="rows">
      <div class="row"><span class="k">発行番号：</span><span id="ticketNo">―</span></div>
      <div class="row"><span class="k">料金：</span><span id="ticketPrice">―</span></div>
      <div class="row"><span class="k">ご注意：</span>帰りの便は現地調達です</div>
    </div>
  </div>
</div>

<div class="triviaBox" id="triviaBox" style="display:none;">
  <div class="tlabel">時代トリビア <span id="triviaCount"></span></div>
  <div class="ttext" id="triviaText"></div>
</div>
<button class="bigBtn nextBtn" id="triviaBtn" style="display:none;">つぎのトリビア ▶</button>
<button class="bigBtn goBtn" id="goBtn" style="display:none;">しゅっぱつ！</button>

<div class="log" id="journeyLog"></div>

<h2>切符図鑑</h2>
<div class="zukanBox">
  <div class="zukanHead" id="zukanHead">0/9 時代制覇</div>
  <div class="zukanCeleb" id="zukanCeleb" style="display:none;">🎉 全時代制覇！あなたは真の時間旅行者です！</div>
  <ul class="zukanList" id="zukanList"></ul>
</div>

<footer>
  <a class="portalBtn" href="https://9rdyzkr686-png.github.io/sora-field-scanner/portal/">全サイト一覧へ</a>
  <div class="credit">JIKAN-6 時間旅行券売機 ／ 時間旅行は自己責任でお願いします</div>
</footer>

  {
    name: "明治",

    trivia: [

    trivia: [
      "平成は1989年から2019年まで、30年あまり続きました。",
      "ポケベルから携帯電話、そしてスマホへ。連絡の道具が大きく変わった時代です。",

  {

    trivia: [
      "月の重力は地球の約6分の1。大きくジャンプできます。",
      "月面からは、地球が青く丸く浮かんで見えます。",
      "月には大気がほとんどないので、足跡は長く残ると言われています。",
      "月面基地ができたら、地球の夜景ならぬ「地球見」が名物になるかもしれません。"
    ],
    log: [
      "ロケットがゆっくり浮かび上がりました…",
      "窓の外で地球が小さくなっていきます。",
      "静かの海が見えてきました。",
      "到着！月面基地です。地球見をお楽しみください。"
    ]

var currentEra = -1;
var triviaIdx = 0;
var timers = [];

function el(id) { return document.getElementById(id); }

function dateSeed() {
  var d = new Date();
  return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
}

function pad2(n) {
  return (n < 10 ? "0" : "") + n;
}

function clearTimers() {
  var i;
  for (i = 0; i < timers.length; i++) { clearTimeout(timers[i]); }
  timers = [];
}

function showTrivia() {
  var era = ERAS[currentEra];
  el("triviaText").innerHTML = era.trivia[triviaIdx];
  el("triviaCount").innerHTML = "（" + (triviaIdx + 1) + " / " + era.trivia.length + "）";
}

function selectEra(idx) {
  var era = ERAS[idx];
  var no;
  clearTimers();
  currentEra = idx;
  triviaIdx = 0;
  el("goBtn").disabled = false;

  var btns = el("eraGrid").getElementsByTagName("button");
  var i;
  for (i = 0; i < btns.length; i++) {
    btns[i].className = "eraBtn" + (i === idx ? " selected" : "");
  }

  no = dateSeed() + "-" + pad2(idx + 1);
  el("ticketNo").innerHTML = "No. " + no;
  el("ticketDest").innerHTML = era.name;
  el("ticketPrice").innerHTML = era.price;
  el("ticketStamp").innerHTML = era.stamp + "<br>JIKAN-6";
  el("ticketPlaceholder").style.display = "none";
  el("ticket").style.display = "block";
  el("triviaBox").style.display = "block";
  el("triviaBtn").style.display = "block";
  el("goBtn").style.display = "block";
  el("journeyLog").style.display = "none";
  el("journeyLog").innerHTML = "";
  showTrivia();
  recordTicket(idx);
}

var ZUKAN_KEY = "jikan6_zukan_v1";

function loadZukan() {
  try {
    var s = localStorage.getItem(ZUKAN_KEY);
    if (s) {
      var o = JSON.parse(s);
      if (o && typeof o === "object") { return o; }
    }
  } catch (e) { }
  return {};
}

function recordTicket(idx) {
  try {
    var z = loadZukan();
    var k = ERAS[idx].name;
    z[k] = (z[k] || 0) + 1;
    localStorage.setItem(ZUKAN_KEY, JSON.stringify(z));
  } catch (e) { }
  renderZukan();
}

function renderZukan() {
  var z = loadZukan();
  var got = 0;
  var html = "";
  var i, c;
  for (i = 0; i < ERAS.length; i++) {
    c = z[ERAS[i].name] || 0;
    if (c > 0) { got++; }
    html += "<li><span class=\"zname\">" + ERAS[i].name + "</span>" +
      (c > 0
        ? "<span class=\"zcount\">発行 " + c + " 枚</span>"
        : "<span class=\"zcount none\">未発行</span>") +
      "</li>";
  }
  el("zukanList").innerHTML = html;
  el("zukanHead").innerHTML = got + "/9 時代制覇";
  el("zukanCeleb").style.display = (got === ERAS.length) ? "block" : "none";
}

function nextTrivia() {
  if (currentEra < 0) { return; }
  triviaIdx = (triviaIdx + 1) % ERAS[currentEra].trivia.length;
  showTrivia();
}

function appendLogLine(text, isArrive, delay) {
  var t = setTimeout(function () {
    var log = el("journeyLog");
    var div = document.createElement("div");
    if (isArrive) { div.className = "arrive"; }
    div.innerHTML = text;
    log.appendChild(div);
  }, delay);
  timers.push(t);
}

function depart() {
  if (currentEra < 0) { return; }
  var era = ERAS[currentEra];
  var log = el("journeyLog");
  var i;
  clearTimers();
  log.innerHTML = "";
  log.style.display = "block";
  el("goBtn").disabled = true;
  for (i = 0; i < era.log.length; i++) {
    appendLogLine(era.log[i], i === era.log.length - 1, 800 * (i + 1));
  }
  var t = setTimeout(function () { el("goBtn").disabled = false; }, 800 * era.log.length + 200);
  timers.push(t);
}

function init() {
  var grid = el("eraGrid");
  var i;
  for (i = 0; i < ERAS.length; i++) {
    (function (idx) {
      var b = document.createElement("button");
      b.className = "eraBtn";
      b.innerHTML = ERAS[idx].name;
      b.onclick = function () { selectEra(idx); };
      grid.appendChild(b);
    })(i);
  }
  var rec = dateSeed() % ERAS.length;
  el("osusumeEra").innerHTML = ERAS[rec].name;
  el("osusumeWhy").innerHTML = ERAS[rec].why;
  el("triviaBtn").onclick = nextTrivia;
  el("goBtn").onclick = depart;
  renderZukan();
}

init();
</script>
</body>
</html>
